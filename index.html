<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07070a">
<title>PORTFOLIO — Creative Studio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    background:#050507;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,.055), transparent 32%),
        #050507;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
    user-select:none;
    -webkit-user-select:none;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9998;
    background:
        linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
    background-size:55px 55px;
    mask-image:linear-gradient(to bottom,black,transparent 85%);
}

#particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
}

/* =========================
   CURSOR GLOW
========================= */

.cursorGlow{
    position:fixed;
    width:320px;
    height:320px;
    border-radius:50%;
    pointer-events:none;
    z-index:1;
    transform:translate(-50%,-50%);
    background:radial-gradient(
        circle,
        rgba(255,255,255,.045),
        rgba(120,100,255,.018) 35%,
        transparent 70%
    );
    filter:blur(8px);
}

/* =========================
   AURORA
========================= */

.aurora{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.16;
    animation:floatBlob 15s ease-in-out infinite alternate;
}

.blob.one{
    width:420px;
    height:420px;
    background:#6c5ce7;
    top:-180px;
    left:-120px;
}

.blob.two{
    width:360px;
    height:360px;
    background:#0077ff;
    right:-120px;
    top:28%;
    animation-delay:-5s;
}

.blob.three{
    width:450px;
    height:450px;
    background:#b44cff;
    left:30%;
    bottom:-280px;
    animation-delay:-9s;
}

@keyframes floatBlob{
    from{
        transform:translate3d(0,0,0) scale(1);
    }
    to{
        transform:translate3d(60px,-40px,0) scale(1.12);
    }
}

/* =========================
   HEADER
========================= */

nav{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5vw;
    z-index:100;
    background:rgba(5,5,7,.42);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.06);
}

.navLogo{
    font-size:13px;
    font-weight:800;
    letter-spacing:.28em;
    opacity:.85;
}

.navRight{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:rgba(255,255,255,.45);
}

.statusDot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 14px rgba(255,255,255,.8);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{opacity:.3;transform:scale(.7)}
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:120px 20px 80px;
}

.eyebrow{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:28px;
    font-size:10px;
    letter-spacing:.38em;
    text-transform:uppercase;
    color:rgba(255,255,255,.42);
    animation:fadeUp 1.2s ease both;
}

.eyebrow::before,
.eyebrow::after{
    content:"";
    width:34px;
    height:1px;
    background:rgba(255,255,255,.2);
}

/* =========================
   PREMIUM LENS TITLE
========================= */

.titleStage{
    position:relative;
    display:inline-block;
    overflow:visible;
}

.title{
    position:relative;
    z-index:2;
    font-size:clamp(54px,11vw,170px);
    line-height:.88;
    font-weight:900;
    letter-spacing:-.075em;
    white-space:nowrap;

    background:linear-gradient(
        180deg,
        #ffffff 0%,
        #e8e8eb 42%,
        #8f8f98 100%
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    filter:drop-shadow(0 18px 45px rgba(0,0,0,.35));

    animation:titleIn 1.4s cubic-bezier(.16,1,.3,1) both;
}

@keyframes titleIn{
    from{
        opacity:0;
        transform:translateY(35px) scale(.96);
        filter:blur(12px);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

/* lens */

.lens{
    position:absolute;
    z-index:5;
    top:50%;
    left:0;

    width:clamp(115px,13vw,205px);
    height:clamp(115px,13vw,205px);

    border-radius:50%;
    transform:translate(-50%,-50%);

    pointer-events:none;

    background:
        radial-gradient(
            circle at 30% 24%,
            rgba(255,255,255,.23),
            rgba(255,255,255,.07) 20%,
            rgba(255,255,255,.025) 50%,
            rgba(255,255,255,.07) 100%
        );

    border:1px solid rgba(255,255,255,.48);

    box-shadow:
        inset 0 0 22px rgba(255,255,255,.08),
        inset 0 0 55px rgba(140,160,255,.07),
        0 0 22px rgba(255,255,255,.07),
        0 0 70px rgba(120,130,255,.055);

    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);

    animation:lensMove 8s cubic-bezier(.45,0,.55,1) infinite alternate;
}

/* moving highlight on glass */

.lens::before{
    content:"";
    position:absolute;
    width:38%;
    height:13%;
    left:20%;
    top:13%;
    border-radius:50%;
    transform:rotate(-25deg);
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.42),
        transparent
    );
    filter:blur(3px);
    opacity:.55;
}

.lens::after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.11);
    box-shadow:
        inset 8px 8px 20px rgba(255,255,255,.04),
        inset -8px -8px 20px rgba(0,0,0,.12);
}

@keyframes lensMove{
    0%{
        left:3%;
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        left:50%;
        transform:translate(-50%,-50%) scale(1.025);
    }

    100%{
        left:97%;
        transform:translate(-50%,-50%) scale(1);
    }
}

/*
  Refraction layer:
  A duplicated PORTFOLIO text sits above the original and
  is clipped to the lens circle.
*/

.refractedText{
    position:absolute;
    z-index:7;
    inset:0;

    font-size:clamp(54px,11vw,170px);
    line-height:.88;
    font-weight:900;
    letter-spacing:-.075em;
    white-space:nowrap;

    background:
        linear-gradient(
            180deg,
            #fff,
            #dcdce5 45%,
            #858593
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    transform:scale(1.035);
    filter:
        blur(.65px)
        drop-shadow(2px 0 rgba(255,70,100,.55))
        drop-shadow(-2px 0 rgba(50,180,255,.55));

    clip-path:circle(
        clamp(57px,6.5vw,102px)
        at var(--lensX) 50%
    );

    pointer-events:none;
}

.heroDescription{
    max-width:600px;
    margin:34px auto 0;
    color:rgba(255,255,255,.47);
    font-size:14px;
    line-height:1.9;
    animation:fadeUp 1.2s .35s ease both;
}

.scrollHint{
    position:absolute;
    bottom:34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    color:rgba(255,255,255,.3);
    font-size:9px;
    letter-spacing:.3em;
    text-transform:uppercase;
}

.scrollLine{
    width:1px;
    height:48px;
    background:linear-gradient(
        to bottom,
        rgba(255,255,255,.5),
        transparent
    );
    animation:scrollLine 2s ease-in-out infinite;
}

@keyframes scrollLine{
    50%{transform:scaleY(.45);opacity:.3}
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   PORTFOLIO SECTION
========================= */

.portfolioSection{
    position:relative;
    z-index:3;
    padding:90px 5vw 130px;
}

.sectionHead{
    max-width:1200px;
    margin:0 auto 42px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
}

.sectionLabel{
    font-size:10px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:rgba(255,255,255,.36);
    margin-bottom:14px;
}

.sectionTitle{
    font-size:clamp(30px,5vw,62px);
    letter-spacing:-.055em;
    font-weight:800;
}

.sectionCount{
    color:rgba(255,255,255,.28);
    font-size:11px;
    letter-spacing:.15em;
}

/* =========================
   CATEGORY GRID
========================= */

.categories{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.category{
    position:relative;
    min-height:330px;
    padding:1px;
    border-radius:26px;
    overflow:hidden;
    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.22),
            rgba(255,255,255,.035) 35%,
            rgba(255,255,255,.025) 70%,
            rgba(255,255,255,.13)
        );

    transition:
        transform .65s cubic-bezier(.16,1,.3,1),
        box-shadow .65s ease;

    animation:cardReveal .9s both;
}

.category:nth-child(1){animation-delay:.05s}
.category:nth-child(2){animation-delay:.12s}
.category:nth-child(3){animation-delay:.19s}
.category:nth-child(4){animation-delay:.26s}
.category:nth-child(5){animation-delay:.33s}
.category:nth-child(6){animation-delay:.40s}

@keyframes cardReveal{
    from{
        opacity:0;
        transform:translateY(35px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.category:hover{
    transform:translateY(-9px);
    box-shadow:
        0 30px 80px rgba(0,0,0,.42),
        0 0 35px rgba(255,255,255,.045);
}

.category::before{
    content:"";
    position:absolute;
    width:160px;
    height:160px;
    right:-70px;
    top:-70px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    filter:blur(25px);
    transition:.7s;
}

.category:hover::before{
    transform:scale(2);
    opacity:.6;
}

.cardInner{
    position:relative;
    height:100%;
    min-height:328px;
    border-radius:25px;
    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(25,25,31,.92),
            rgba(10,10,13,.88)
        );

    backdrop-filter:blur(18px);
}

.cardVisual{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.cardVisual::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            transparent 25%,
            rgba(5,5,7,.18) 50%,
            rgba(5,5,7,.96) 100%
        );
}

.cardVisual img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.34;
    filter:grayscale(.15) saturate(.75);
    transform:scale(1.03);
    transition:
        transform 1s cubic-bezier(.16,1,.3,1),
        opacity .8s ease,
        filter .8s ease;
}

.category:hover .cardVisual img{
    transform:scale(1.11);
    opacity:.55;
    filter:grayscale(0) saturate(1);
}

.cardTop{
    position:absolute;
    z-index:3;
    top:22px;
    left:22px;
    right:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.number{
    font-size:10px;
    color:rgba(255,255,255,.4);
    letter-spacing:.18em;
}

.arrow{
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,255,255,.13);
    border-radius:50%;
    color:rgba(255,255,255,.55);
    transition:.5s;
}

.category:hover .arrow{
    background:rgba(255,255,255,.1);
    color:#fff;
    transform:rotate(45deg);
}

.cardContent{
    position:absolute;
    z-index:4;
    left:24px;
    right:24px;
    bottom:23px;
}

.icon{
    font-size:21px;
    margin-bottom:15px;
    opacity:.75;
}

.cardTitle{
    font-size:25px;
    font-weight:700;
    letter-spacing:-.04em;
    margin-bottom:8px;
}

.cardDescription{
    color:rgba(255,255,255,.4);
    font-size:11px;
    line-height:1.6;
    max-width:260px;
}

.cardShine{
    position:absolute;
    z-index:6;
    width:80px;
    height:180%;
    top:-40%;
    left:-100px;
    transform:rotate(18deg);
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.11),
        transparent
    );
    filter:blur(5px);
    transition:1s;
}

.category:hover .cardShine{
    left:110%;
}

/* =========================
   GALLERY
========================= */

.galleryPage{
    position:relative;
    z-index:10;
    min-height:100vh;
    padding:110px 5vw 100px;
    display:none;
}

.galleryPage.active{
    display:block;
    animation:pageIn .7s cubic-bezier(.16,1,.3,1);
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.backBtn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-bottom:45px;
    padding:12px 18px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:100px;
    background:rgba(255,255,255,.035);
    color:rgba(255,255,255,.7);
    cursor:pointer;
    font-size:10px;
    letter-spacing:.16em;
    text-transform:uppercase;
    transition:.4s;
}

.backBtn:hover{
    background:rgba(255,255,255,.09);
    color:#fff;
    transform:translateX(-4px);
}

.galleryHeader{
    max-width:1200px;
    margin:0 auto 45px;
}

.galleryTitle{
    font-size:clamp(45px,8vw,100px);
    letter-spacing:-.07em;
    font-weight:900;
}

.galleryDesc{
    color:rgba(255,255,255,.4);
    font-size:13px;
    margin-top:12px;
}

.galleryGrid{
    max-width:1200px;
    margin:auto;
    columns:3 280px;
    column-gap:18px;
}

.galleryItem{
    position:relative;
    display:block;
    width:100%;
    margin-bottom:18px;
    overflow:hidden;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.07);
    background:#0c0c10;
    cursor:pointer;
    break-inside:avoid;
    transform:translateZ(0);
}

.galleryItem::after{
    content:"VIEW";
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-size:9px;
    letter-spacing:.3em;
    color:#fff;
    background:rgba(0,0,0,.35);
    opacity:0;
    transition:.45s;
}

.galleryItem:hover::after{
    opacity:1;
}

.galleryItem img{
    display:block;
    width:100%;
    height:auto;
    pointer-events:none;
    -webkit-user-drag:none;
    transition:transform .8s cubic-bezier(.16,1,.3,1);
}

.galleryItem:hover img{
    transform:scale(1.035);
}

/* =========================
   LIGHTBOX
========================= */

.lightbox{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:30px;
    background:rgba(2,2,4,.9);
    backdrop-filter:blur(25px);
}

.lightbox.active{
    display:flex;
    animation:lightIn .35s ease;
}

@keyframes lightIn{
    from{opacity:0}
    to{opacity:1}
}

.lightbox img{
    max-width:94vw;
    max-height:88vh;
    object-fit:contain;
    border-radius:10px;
    box-shadow:0 30px 100px rgba(0,0,0,.7);
    pointer-events:none;
    -webkit-user-drag:none;
    animation:imageIn .5s cubic-bezier(.16,1,.3,1);
}

@keyframes imageIn{
    from{
        opacity:0;
        transform:scale(.94);
        filter:blur(10px);
    }
    to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

.closeLightbox{
    position:absolute;
    top:25px;
    right:30px;
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.05);
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

/* =========================
   FOOTER
========================= */

footer{
    position:relative;
    z-index:3;
    padding:35px 5vw;
    border-top:1px solid rgba(255,255,255,.06);
    display:flex;
    justify-content:space-between;
    color:rgba(255,255,255,.25);
    font-size:9px;
    letter-spacing:.18em;
    text-transform:uppercase;
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    nav{
        padding:0 20px;
    }

    .navRight{
        display:none;
    }

    .hero{
        min-height:88vh;
        padding-top:110px;
    }

    .title{
        font-size:clamp(45px,15vw,90px);
    }

    .refractedText{
        font-size:clamp(45px,15vw,90px);
    }

    .categories{
        grid-template-columns:1fr;
    }

    .category{
        min-height:300px;
    }

    .cardInner{
        min-height:298px;
    }

    .sectionHead{
        display:block;
    }

    .sectionCount{
        margin-top:15px;
    }

    footer{
        flex-direction:column;
        gap:12px;
    }
}

@media(max-width:500px){

    .heroDescription{
        font-size:12px;
        max-width:330px;
    }

    .portfolioSection{
        padding-left:18px;
        padding-right:18px;
    }

    .galleryPage{
        padding-left:18px;
        padding-right:18px;
    }

    .galleryGrid{
        columns:1;
    }

    .lens{
        width:100px;
        height:100px;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="cursorGlow" id="cursorGlow"></div>

<div class="aurora">
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>
</div>

<nav>
    <div class="navLogo">CREATIVE / STUDIO</div>

    <div class="navRight">
        <span class="statusDot"></span>
        AVAILABLE FOR WORK
    </div>
</nav>

<!-- =========================
     HOME
========================= -->

<main id="home">

<section class="hero">

    <div class="eyebrow">
        DIGITAL ART & DESIGN
    </div>

    <div class="titleStage" id="titleStage">

        <div class="title">
            PORTFOLIO
        </div>

        <div class="refractedText" id="refractedText">
            PORTFOLIO
        </div>

        <div class="lens" id="lens"></div>

    </div>

    <p class="heroDescription">
        A curated collection of VTuber models, visual identities,
        banners, emotes, overlays and creative artwork.
    </p>

    <div class="scrollHint">
        EXPLORE
        <span class="scrollLine"></span>
    </div>

</section>


<section class="portfolioSection">

    <div class="sectionHead">

        <div>
            <div class="sectionLabel">
                Selected Work
            </div>

            <h2 class="sectionTitle">
                Explore the collection.
            </h2>
        </div>

        <div class="sectionCount">
            06 CATEGORIES
        </div>

    </div>


    <div class="categories" id="categories"></div>

</section>

</main>


<!-- =========================
     GALLERY PAGE
========================= -->

<section class="galleryPage" id="galleryPage">

    <button class="backBtn" id="backBtn">
        ← &nbsp; BACK TO PORTFOLIO
    </button>

    <div class="galleryHeader">
        <h1 class="galleryTitle" id="galleryTitle"></h1>
        <p class="galleryDesc" id="galleryDesc"></p>
    </div>

    <div class="galleryGrid" id="galleryGrid"></div>

</section>


<footer>
    <span>© 2026 CREATIVE STUDIO</span>
    <span>DESIGNED WITH PRECISION</span>
</footer>


<!-- =========================
     LIGHTBOX
========================= -->

<div class="lightbox" id="lightbox">

    <button class="closeLightbox" id="closeLightbox">
        ×
    </button>

    <img id="lightboxImage" src="" alt="Portfolio Preview">

</div>


<script>

/* ==========================================
   PORTFOLIO DATA
   ALL FILES ARE IN ROOT DIRECTORY
========================================== */

const portfolio = {

    vtuber:{
        title:"VTuber Model",
        description:"PNG VTuber models and character artwork.",
        icon:"✦",
        images:[
            "Png model 1.jpeg",
            "Png model 2.jpeg",
            "Png model 3.jpeg",
            "Png model 4.jpeg",

/* ==========================================
   SAFE IMAGE PATH
========================================== */

function imagePath(filename){
    return encodeURI(filename);
}


/* ==========================================
   CATEGORY CARDS
========================================== */

const categories =
document.getElementById("categories");

let cardIndex = 1;

Object.entries(portfolio).forEach(([key,item]) => {

    const card =
    document.createElement("article");

    card.className="category";

    card.innerHTML=`

        <div class="cardInner">

            <div class="cardVisual">

                <img
                    src="${imagePath(item.images[0])}"
                    alt=""
                    draggable="false"

                <span class="number">
                    0${cardIndex}
                </span>

                    ↗

                </div>

                    ${item.title}
                </div>

                <div class="cardDescription">
                    ${item.description}
                </div>

            </div>

/* ==========================================
   GALLERY
========================================== */

const home =
document.getElementById("home");

const galleryPage =
document.getElementById("galleryPage");

const galleryTitle =
document.getElementById("galleryTitle");

const galleryDesc =
document.getElementById("galleryDesc");

const galleryGrid =
document.getElementById("galleryGrid");

function openGallery(category){

    const item =
    portfolio[category];

    galleryTitle.textContent =
    item.title;

    galleryDesc.textContent =
    item.description;

    galleryGrid.innerHTML="";

    item.images.forEach(filename=>{

        const wrapper =
        document.createElement("div");

        wrapper.className="galleryItem";

        const img =
        document.createElement("img");

        img.src=imagePath(filename);
        img.alt=item.title;
        img.draggable=false;

        img.addEventListener("contextmenu",e=>{
            e.preventDefault();
        });

        wrapper.appendChild(img);

        wrapper.addEventListener("click",()=>{
            openLightbox(img.src);
        });

        galleryGrid.appendChild(wrapper);

    });

    home.style.display="none";
    galleryPage.classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"instant"
    });
}


/* ==========================================
   BACK BUTTON
========================================== */

document
.getElementById("backBtn")
.addEventListener("click",()=>{

    galleryPage.classList.remove("active");

    home.style.display="block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

});


/* ==========================================
   LIGHTBOX
========================================== */

const lightbox =
document.getElementById("lightbox");

const lightboxImage =
document.getElementById("lightboxImage");

function openLightbox(src){

    lightboxImage.src=src;

    lightbox.classList.add("active");

}

function closeLightbox(){

    lightbox.classList.remove("active");

    setTimeout(()=>{
        lightboxImage.src="";
    },250);

}

document
.getElementById("closeLightbox")
.addEventListener("click",closeLightbox);

lightbox.addEventListener("click",e=>{

    if(e.target===lightbox){
        closeLightbox();
    }

});

document.addEventListener("keydown",e=>{

    if(e.key==="Escape"){
        closeLightbox();
    }

});


/* ==========================================
   LENS POSITION
========================================== */

const lens =
document.getElementById("lens");

const titleStage =
document.getElementById("titleStage");

const refractedText =
document.getElementById("refractedText");

function updateLens(){

    const stageWidth =
    titleStage.offsetWidth;

    const lensRect =
    lens.getBoundingClientRect();

    const stageRect =
    titleStage.getBoundingClientRect();

    const center =
    lensRect.left +
    lensRect.width / 2 -
    stageRect.left;

    const percentage =
    (center / stageWidth) * 100;

    refractedText.style.setProperty(
        "--lensX",
        percentage + "%"
    );

    requestAnimationFrame(updateLens);

}

updateLens();


/* ==========================================
   MOUSE GLOW
========================================== */

const cursorGlow =
document.getElementById("cursorGlow");

let mouseX=0;
let mouseY=0;

let glowX=0;
let glowY=0;

window.addEventListener("mousemove",e=>{

    mouseX=e.clientX;
    mouseY=e.clientY;

});

function animateGlow(){

    glowX +=
    (mouseX-glowX)*.08;

    glowY +=
    (mouseY-glowY)*.08;

    cursorGlow.style.left=
    glowX+"px";

    cursorGlow.style.top=
    glowY+"px";

    requestAnimationFrame(animateGlow);

}

animateGlow();


/* ==========================================
   PARTICLE SYSTEM
========================================== */

const canvas =
document.getElementById("particles");

const ctx =
canvas.getContext("2d");

let particles=[];

let particleMouse={
    x:null,
    y:null
};

function resizeCanvas(){

    canvas.width=
    window.innerWidth;

    canvas.height=
    window.innerHeight;

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


for(let i=0;i<65;i++){

    particles.push({

        x:Math.random()*window.innerWidth,

        y:Math.random()*window.innerHeight,

        size:Math.random()*1.6+.3,

        speedX:(Math.random()-.5)*.22,

        speedY:(Math.random()-.5)*.22,

        opacity:Math.random()*.45+.08

    });

}


window.addEventListener("mousemove",e=>{

    particleMouse.x=e.clientX;
    particleMouse.y=e.clientY;

});


function drawParticles(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach((p,i)=>{

        p.x+=p.speedX;
        p.y+=p.speedY;

        if(p.x<0)p.x=canvas.width;
        if(p.x>canvas.width)p.x=0;

        if(p.y<0)p.y=canvas.height;
        if(p.y>canvas.height)p.y=0;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
        `rgba(255,255,255,${p.opacity})`;

        ctx.fill();


        for(let j=i+1;j<particles.length;j++){

            const q=particles[j];

            const dx=p.x-q.x;
            const dy=p.y-q.y;

            const distance=
            Math.sqrt(dx*dx+dy*dy);

            if(distance<115){

                ctx.beginPath();

                ctx.moveTo(p.x,p.y);

                ctx.lineTo(q.x,q.y);

                ctx.strokeStyle=
                `rgba(255,255,255,${
                    .035*(1-distance/115)
                })`;

                ctx.lineWidth=.5;

                ctx.stroke();

            }

        }

    });

    requestAnimationFrame(drawParticles);

}

drawParticles();

);

document.addEventListener(
"keydown",
e=>{

    const key=
    e.key.toLowerCase();

    if(
        e.ctrlKey &&
        (
            key==="s" ||
            key==="u" ||
            key==="c" ||
            key==="j" ||
            key==="i"
        )
    ){
        e.preventDefault();
    }

    if(e.key==="F12"){
        e.preventDefault();
    }

});

{passive:false}
