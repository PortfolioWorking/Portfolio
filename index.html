<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PORTFOLIO</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    background:#05060b;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}


/* =====================================================
   PREMIUM BACKGROUND
===================================================== */

body{
    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(77,54,190,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 25%,
            rgba(0,130,160,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 85%,
            rgba(130,25,110,.12),
            transparent 35%
        ),
        #05060b;
}


/* subtle moving light */

.background-light{
    position:fixed;
    inset:-30%;

    z-index:-3;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at 30% 35%,
            rgba(88,64,210,.10),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 75% 60%,
            rgba(0,180,210,.07),
            transparent 35%
        );

    animation:
        backgroundMove 18s ease-in-out infinite alternate;
}

@keyframes backgroundMove{

    from{
        transform:
            translate3d(-2%,0,0)
            scale(1);
    }

    to{
        transform:
            translate3d(2%,2%,0)
            scale(1.04);
    }
}


/* =====================================================
   LIGHTWEIGHT PARTICLES
===================================================== */

.particles{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:-1;

    overflow:hidden;
}

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:rgba(255,255,255,.5);

    animation:
        floatParticle 12s linear infinite;
}

@keyframes floatParticle{

    0%{
        transform:
            translate3d(0,110vh,0);

        opacity:0;
    }

    15%{
        opacity:.55;
    }

    85%{
        opacity:.35;
    }

    100%{
        transform:
            translate3d(25px,-10vh,0);

        opacity:0;
    }
}


/* =====================================================
   HOME
===================================================== */

#homePage{
    width:100%;
}


/* =====================================================
   HERO
===================================================== */

.hero{

    min-height:72vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:
        55px 20px 35px;

    position:relative;
}


/* top label */

.hero-label{

    margin-bottom:22px;

    color:
        rgba(255,255,255,.52);

    font-size:10px;

    font-weight:600;

    letter-spacing:6px;

    text-transform:uppercase;

    animation:
        fadeIn .9s ease both;
}


/* =====================================================
   TITLE
===================================================== */

.title-wrap{

    position:relative;

    width:
        min(700px,92vw);

    height:300px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:visible;
}


/* actual text */

.title-normal{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    z-index:2;

    pointer-events:none;
}


.word{

    display:block;

    font-size:
        clamp(76px,12vw,155px);

    line-height:.80;

    font-weight:900;

    letter-spacing:
        clamp(3px,.7vw,9px);

    color:#fff;

    white-space:nowrap;

    text-align:center;

    text-shadow:
        0 0 25px rgba(255,255,255,.06);
}


.word:first-child{
    margin-bottom:18px;
}


/* =====================================================
   REFRACTED TEXT
===================================================== */

/*
   The refracted title sits inside the lens.
   The lens itself moves using transform, so there
   is no expensive per-frame JS calculation.
*/

.lens{

    position:absolute;

    left:50%;
    top:50%;

    width:150px;
    height:150px;

    transform:
        translate3d(-50%,-50%,0)
        translateY(-70px);

    z-index:5;

    border-radius:50%;

    overflow:hidden;

    pointer-events:none;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.48);

    box-shadow:
        0 0 18px rgba(120,180,255,.12),
        inset 0 0 22px rgba(255,255,255,.08);

    will-change:transform;

    animation:
        lensMove 6s ease-in-out infinite;
}


/*
   PORT -> FOLIO -> PORT

   The distance is deliberately small so the
   lens remains over the typography.
*/

@keyframes lensMove{

    0%,
    100%{
        transform:
            translate3d(-50%,-50%,0)
            translateY(-70px);
    }

    50%{
        transform:
            translate3d(-50%,-50%,0)
            translateY(70px);
    }
}


/* refracted duplicate */

.lens-text{

    position:absolute;

    left:50%;
    top:50%;

    width:700px;
    max-width:none;

    height:300px;

    transform:
        translate3d(-50%,-50%,0);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    filter:
        blur(.8px);

    mix-blend-mode:screen;

    pointer-events:none;
}


.lens-text .word{

    color:#fff;

    text-shadow:
        -3px 0 rgba(255,40,100,.75),
         3px 0 rgba(0,210,255,.75),
         0 0 15px rgba(255,255,255,.25);

    transform:
        scale(1.07);
}


/* lens reflection */

.lens::before{

    content:"";

    position:absolute;

    width:65%;
    height:25%;

    top:10%;
    left:12%;

    border-radius:50%;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.35),
            transparent
        );

    transform:
        rotate(-25deg);

    filter:blur(4px);

    opacity:.55;
}


/* subtle RGB edge */

.lens::after{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    border:
        1px solid rgba(100,220,255,.22);

    box-shadow:
        inset 1px 0 rgba(255,70,120,.18),
        inset -1px 0 rgba(0,220,255,.18);
}


/* =====================================================
   SUBTITLE
===================================================== */

.hero-subtitle{

    margin-top:18px;

    color:
        rgba(255,255,255,.45);

    font-size:
        clamp(9px,1.2vw,12px);

    letter-spacing:
        clamp(2px,.7vw,5px);

    text-transform:uppercase;

    text-align:center;

    animation:
        fadeIn 1s ease .2s both;
}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =====================================================
   PORTFOLIO SECTION
===================================================== */

.portfolio-section{

    width:
        min(1200px,92%);

    margin:
        0 auto;

    padding:
        15px 0 80px;
}


/* heading */

.section-heading{

    display:flex;

    align-items:center;

    margin-bottom:30px;
}


.section-heading h2{

    flex-shrink:0;

    font-size:11px;

    letter-spacing:5px;

    color:
        rgba(255,255,255,.55);

    text-transform:uppercase;
}


.section-line{

    height:1px;

    flex:1;

    margin-left:25px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.16),
            transparent
        );
}


/* =====================================================
   FOLDER GRID
===================================================== */

.folder-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:28px;

    perspective:1200px;
}


/* =====================================================
   FOLDER
===================================================== */

.folder-card{

    position:relative;

    height:275px;

    cursor:pointer;

    perspective:900px;

    transform-style:preserve-3d;

    animation:
        cardIn .7s ease both;
}


.folder-card:nth-child(2){
    animation-delay:.05s;
}

.folder-card:nth-child(3){
    animation-delay:.10s;
}

.folder-card:nth-child(4){
    animation-delay:.15s;
}

.folder-card:nth-child(5){
    animation-delay:.20s;
}

.folder-card:nth-child(6){
    animation-delay:.25s;
}


@keyframes cardIn{

    from{
        opacity:0;
        transform:
            translateY(25px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}


/* =====================================================
   FOLDER BODY
===================================================== */

.folder-body{

    position:absolute;

    inset:
        14px 0 0;

    overflow:hidden;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.035)
        );

    border:
        1px solid rgba(255,255,255,.13);

    box-shadow:
        0 18px 45px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.08);

    transform:
        translateZ(15px);

    transition:
        transform .35s ease,
        box-shadow .35s ease,
        border-color .35s ease;
}


/* =====================================================
   FOLDER TAB
===================================================== */

.folder-tab{

    position:absolute;

    top:-1px;
    left:18px;

    width:105px;
    height:27px;

    border-radius:
        10px 10px 0 0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.05)
        );

    border:
        1px solid rgba(255,255,255,.13);

    border-bottom:none;

    z-index:3;
}


/* =====================================================
   FOLDER IMAGE
===================================================== */

.folder-preview{

    position:absolute;

    top:35px;
    left:15px;
    right:15px;
    bottom:57px;

    overflow:hidden;

    border-radius:12px;

    background:
        rgba(0,0,0,.06);

    border:
        1px solid rgba(255,255,255,.08);

    transform:
        translateZ(25px);
}


.folder-preview img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    opacity:1 !important;

    filter:none !important;

    user-select:none;

    -webkit-user-drag:none;

    pointer-events:none;

    transition:
        transform .4s ease;
}


.folder-card:hover
.folder-preview img{

    transform:
        scale(1.035);
}


/* =====================================================
   FOLDER NAME
===================================================== */

.folder-bottom{

    position:absolute;

    left:18px;
    right:18px;

    bottom:15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    transform:
        translateZ(30px);

    z-index:4;
}


.folder-name{

    font-size:14px;

    font-weight:700;

    color:#fff;

    letter-spacing:.3px;

    transition:
        letter-spacing .3s ease;
}


.folder-arrow{

    width:29px;
    height:29px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    border:
        1px solid rgba(255,255,255,.15);

    color:
        rgba(255,255,255,.75);

    transition:
        transform .3s ease,
        background .3s ease;
}


/* =====================================================
   FOLDER SHINE
===================================================== */

.folder-shine{

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            120deg,
            transparent 35%,
            rgba(255,255,255,.10) 50%,
            transparent 65%
        );

    transform:
        translateX(-120%);

    transition:
        transform .65s ease;

    z-index:6;
}


.folder-card:hover
.folder-shine{

    transform:
        translateX(120%);
}


/* =====================================================
   FOLDER HOVER 3D
===================================================== */

.folder-card:hover
.folder-body{

    transform:
        translateZ(35px)
        rotateX(2deg)
        rotateY(-2deg)
        translateY(-7px);

    border-color:
        rgba(255,255,255,.23);

    box-shadow:
        0 28px 60px rgba(0,0,0,.45),
        0 0 25px rgba(100,120,255,.07);
}


.folder-card:hover
.folder-name{

    letter-spacing:1px;
}


.folder-card:hover
.folder-arrow{

    transform:
        translateX(4px);

    background:
        rgba(255,255,255,.08);
}


/* =====================================================
   CATEGORY VIEW
===================================================== */

.category-view{

    display:none;

    min-height:100vh;

    padding:
        55px 5% 80px;

    background:
        #05060b;
}


.category-view.active{
    display:block;

    animation:
        fadeIn .35s ease both;
}


/* =====================================================
   CATEGORY HEADER
===================================================== */

.category-header{

    width:
        min(1200px,100%);

    margin:
        0 auto 35px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}


.category-title{

    font-size:
        clamp(35px,6vw,70px);

    font-weight:900;

    letter-spacing:-2px;

    color:#fff;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button{

    border:
        1px solid rgba(255,255,255,.17);

    background:
        rgba(255,255,255,.05);

    color:#fff;

    padding:
        11px 18px;

    border-radius:999px;

    font-size:11px;

    letter-spacing:2px;

    text-transform:uppercase;

    cursor:pointer;

    transition:
        .25s ease;
}


.back-button:hover{

    background:
        rgba(255,255,255,.11);

    transform:
        translateX(-3px);
}


/* =====================================================
   GALLERY
===================================================== */

.gallery{

    width:
        min(1200px,100%);

    margin:0 auto;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;
}


.gallery-item{

    min-height:250px;

    overflow:hidden;

    border-radius:14px;

    border:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.025);

    cursor:pointer;

    animation:
        galleryIn .5s ease both;

    transition:
        transform .3s ease,
        border-color .3s ease;
}


@keyframes galleryIn{

    from{
        opacity:0;
        transform:
            translateY(15px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}


.gallery-item:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(255,255,255,.24);
}


.gallery-item img{

    width:100%;
    height:100%;

    min-height:250px;

    display:block;

    object-fit:contain;

    background:
        rgba(0,0,0,.05);

    opacity:1 !important;

    filter:none !important;

    user-select:none;

    -webkit-user-drag:none;

    pointer-events:none;
}


/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox{

    position:fixed;

    inset:0;

    z-index:9999;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        rgba(3,4,9,.94);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);
}


.lightbox.active{
    display:flex;
}


.lightbox img{

    max-width:94vw;

    max-height:88vh;

    object-fit:contain;

    border-radius:8px;

    user-select:none;

    -webkit-user-drag:none;

    pointer-events:none;

    animation:
        lightboxIn .25s ease both;
}


@keyframes lightboxIn{

    from{
        opacity:0;
        transform:
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            scale(1);
    }
}


.lightbox-close{

    position:absolute;

    top:22px;
    right:25px;

    width:42px;
    height:42px;

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.17);

    background:
        rgba(255,255,255,.07);

    color:#fff;

    font-size:22px;

    cursor:pointer;

    transition:
        .25s ease;
}


.lightbox-close:hover{

    background:
        rgba(255,255,255,.13);

    transform:
        rotate(90deg);
}


/* =====================================================
   FOOTER
===================================================== */

footer{

    padding:
        10px 20px 40px;

    text-align:center;

    color:
        rgba(255,255,255,.23);

    font-size:9px;

    letter-spacing:3px;

    text-transform:uppercase;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .folder-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .gallery{
        grid-template-columns:
            repeat(2,1fr);
    }

}


@media(max-width:600px){

    .hero{

        min-height:65vh;

        padding:
            45px 15px 25px;
    }


    .hero-label{

        font-size:8px;

        letter-spacing:4px;

        margin-bottom:15px;
    }


    .title-wrap{

        width:96vw;

        height:225px;
    }


    .word{

        font-size:
            clamp(55px,18vw,95px);

        letter-spacing:2px;
    }


    .word:first-child{
        margin-bottom:12px;
    }


    .lens{

        width:100px;
        height:100px;

        animation-name:
            lensMoveMobile;
    }


    @keyframes lensMoveMobile{

        0%,
        100%{
            transform:
                translate3d(-50%,-50%,0)
                translateY(-52px);
        }

        50%{
            transform:
                translate3d(-50%,-50%,0)
                translateY(52px);
        }
    }


    .lens-text{

        width:96vw;

        height:225px;
    }


    .lens-text .word{

        font-size:
            clamp(55px,18vw,95px);
    }


    .hero-subtitle{

        font-size:8px;

        letter-spacing:2px;

        margin-top:12px;
    }


    .portfolio-section{

        width:92%;

        padding-bottom:60px;
    }


    .folder-grid{

        grid-template-columns:1fr;

        gap:22px;
    }


    .folder-card{

        height:260px;
    }


    .gallery{

        grid-template-columns:1fr;
    }


    .category-header{

        flex-direction:column;

        align-items:flex-start;
    }


    .back-button{
        order:-1;
    }


    .category-title{

        font-size:42px;
    }

}


/* =====================================================
   REDUCE MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;

        transition-duration:.01ms !important;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background-light"></div>

<div
    class="particles"
    id="particles"
></div>


<!-- =====================================================
     HOME
===================================================== -->

<main id="homePage">


    <section class="hero">


        <div class="hero-label">
            Creative Visual Portfolio
        </div>


        <!-- =================================================
             MAIN PORT / FOLIO
        ================================================== -->

        <div class="title-wrap">


            <!-- normal title -->

            <div class="title-normal">

                <span class="word">
                    PORT
                </span>

                <span class="word">
                    FOLIO
                </span>

            </div>


            <!-- =================================================
                 MOVING GLASS LENS

                 Lens stays over PORT/FOLIO only.
            ================================================== -->

            <div class="lens">


                <div class="lens-text">

                    <span class="word">
                        PORT
                    </span>

                    <span class="word">
                        FOLIO
                    </span>

                </div>


            </div>


        </div>


        <div class="hero-subtitle">
            VTuber • Branding • Illustration • Visual Design
        </div>


    </section>


    <!-- =====================================================
         CATEGORIES
    ====================================================== -->

    <section class="portfolio-section">


        <div class="section-heading">

            <h2>
                Selected Works
            </h2>

            <div class="section-line"></div>

        </div>


        <div class="folder-grid">


            <!-- =================================================
                 VTUBER
            ================================================== -->

            <div
                class="folder-card"
                data-category="VTuber Model"
            >

                <div class="folder-body">

                    <div class="folder-tab"></div>

                    <div class="folder-preview">

                        <img
                            src="Png%20model%201.jpeg"
                            alt="VTuber Model"
                            draggable="false"
                        >

                    </div>

                    <div class="folder-shine"></div>

                    <div class="folder-bottom">

                        <div class="folder-name">
                            VTuber Model
                        </div>

                        <div class="folder-arrow">
                            →
                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 LOGO
            ================================================== -->

            <div
                class="folder-card"
                data-category="Logo"
            >

                <div class="folder-body">

                    <div class="folder-tab"></div>

                    <div class="folder-preview">

                        <img
                            src="logo%201.jpeg"
                            alt="Logo"
                            draggable="false"
                        >

                    </div>

                    <div class="folder-shine"></div>

                    <div class="folder-bottom">

                        <div class="folder-name">
                            Logo
                        </div>

                        <div class="folder-arrow">
                            →
                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 BANNER
            ================================================== -->

            <div
                class="folder-card"
                data-category="Banner"
            >

                <div class="folder-body">

                    <div class="folder-tab"></div>

                    <div class="folder-preview">

                        <img
                            src="Banner1.jpeg"
                            alt="Banner"
                            draggable="false"
                        >

                    </div>

                    <div class="folder-shine"></div>

                    <div class="folder-bottom">

                        <div class="folder-name">
                            Banner
                        </div>

                        <div class="folder-arrow">
                            →
                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 EMOTES
            ================================================== -->

            <div
                class="folder-card"
                data-category="Emotes"
            >

                <div class="folder-body">

                    <div class="folder-tab"></div>

                    <div class="folder-preview">

                        <img
                            src="Emotes%201.jpeg"
                            alt="Emotes"
                            draggable="false"
                        >

                    </div>

                    <div class="folder-shine"></div>

                    <div class="folder-bottom">

                        <div class="folder-name">
                            Emotes
                        </div>

                        <div class="folder-arrow">
                            →
                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 ARTSCENE
            ================================================== -->

            <div
                class="folder-card"
                data-category="Artscene"
            >

                <div class="folder-body">

                    <div class="folder-tab"></div>

                    <div class="folder-preview">

                        <img
                            src="Artscene%201.jpeg"
                            alt="Artscene"
                            draggable="false"
                        >

                    </div>

                    <div class="folder-shine"></div>

                    <div class="folder-bottom">

                        <div class="folder-name">
                            Artscene
                        </div>

                        <div class="folder-arrow">
                            →
                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 OVERLAY
            ================================================== -->

            <div
                class="folder-card"
                data-category="Overlay"
            >

                <div class="folder-body">

                    <div class="folder-tab"></div>

                    <div class="folder-preview">

                        <img
                            src="Overlay%201.jpeg"
                            alt="Overlay"
                            draggable="false"
                        >

                    </div>

                    <div class="folder-shine"></div>

                    <div class="folder-bottom">

                        <div class="folder-name">
                            Overlay
                        </div>

                        <div class="folder-arrow">
                            →
                        </div>

                    </div>

                </div>

            </div>


        </div>

    </section>


    <footer>
        © PORTFOLIO — Creative Visual Works
    </footer>


</main>



<!-- =====================================================
     CATEGORY PAGE
===================================================== -->

<section
    class="category-view"
    id="categoryView"
>


    <div class="category-header">


        <button
            class="back-button"
            id="backButton"
        >
            ← Back
        </button>


        <div
            class="category-title"
            id="categoryTitle"
        >
            VTuber Model
        </div>


    </div>


    <div
        class="gallery"
        id="gallery"
    ></div>


</section>



<!-- =====================================================
     LIGHTBOX
===================================================== -->

<div
    class="lightbox"
    id="lightbox"
>


    <button
        class="lightbox-close"
        id="lightboxClose"
    >
        ×
    </button>


    <img
        id="lightboxImage"
        src=""
        alt=""
        draggable="false"
    >


</div>



<script>

/* =====================================================
   IMAGE DATA
===================================================== */

const categories = {

    "VTuber Model":[
        "Png model 1.jpeg",
        "Png model 2.jpeg",
        "Png model 3.jpeg",
        "Png model 4.jpeg",
        "Png model 5.jpeg",
        "Png model 6.jpeg",
        "Png model 7.jpeg",
        "Png model 8.jpeg"
    ],

    "Logo":[
        "logo 1.jpeg",
        "logo4.jpeg",
        "logo5.jpeg",
        "Logo2.jpeg",
        "Logo3.jpeg"
    ],

    "Banner":[
        "Banner1.jpeg",
        "Banner3.jpeg",
        "Banner7.jpeg",
        "Banner6.jpeg",
        "banner5.jpeg",
        "banner4.jpeg",
        "banner2.jpeg"
    ],

    "Emotes":[
        "Emotes 1.jpeg",
        "Emotes 2.jpeg",
        "Emotes 3.jpeg",
        "Emotes 4.jpeg"
    ],

    "Artscene":[
        "Artscene 1.jpeg"
    ],

    "Overlay":[
        "Overlay 1.jpeg"
    ]

};


/* =====================================================
   ELEMENTS
===================================================== */

const homePage =
    document.getElementById("homePage");

const categoryView =
    document.getElementById("categoryView");

const categoryTitle =
    document.getElementById("categoryTitle");

const gallery =
    document.getElementById("gallery");

const backButton =
    document.getElementById("backButton");

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");


/* =====================================================
   IMAGE PATH
===================================================== */

function imagePath(file){

    return encodeURI(file);

}


/* =====================================================
   OPEN CATEGORY
===================================================== */

function openCategory(category){

    homePage.style.display =
        "none";

    categoryView.classList.add(
        "active"
    );

    categoryTitle.textContent =
        category;

    gallery.innerHTML =
        "";


    const images =
        categories[category] || [];


    images.forEach(
        (file,index)=>{


            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "gallery-item";


            item.style.animationDelay =
                `${index * 0.04}s`;


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                imagePath(file);

            img.alt =
                category;

            img.draggable =
                false;

            /*
               Lazy load gallery images
               to reduce initial loading.
            */

            img.loading =
                "lazy";


            item.appendChild(img);

            gallery.appendChild(item);


            item.addEventListener(
                "click",
                ()=>{
                    openLightbox(
                        imagePath(file)
                    );
                }
            );

        }
    );


    window.scrollTo(
        0,
        0
    );

}


/* =====================================================
   FOLDER CLICK
===================================================== */

document
.querySelectorAll(".folder-card")
.forEach(
    card=>{

        card.addEventListener(
            "click",
            ()=>{

                openCategory(
                    card.dataset.category
                );

            }
        );

    }
);


/* =====================================================
   BACK
===================================================== */

backButton.addEventListener(
    "click",
    ()=>{

        categoryView.classList.remove(
            "active"
        );

        homePage.style.display =
            "block";

        window.scrollTo(
            0,
            0
        );

    }
);


/* =====================================================
   LIGHTBOX
===================================================== */

function openLightbox(src){

    lightboxImage.src =
        src;

    lightbox.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";

}


function closeLightbox(){

    lightbox.classList.remove(
        "active"
    );

    lightboxImage.src =
        "";

    document.body.style.overflow =
        "";

}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    event=>{

        if(
            event.target ===
            lightbox
        ){

            closeLightbox();

        }

    }
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key ===
            "Escape"
        ){

            closeLightbox();

        }

    }
);


/* =====================================================
   LIGHTWEIGHT PARTICLES
===================================================== */

const particleContainer =
    document.getElementById(
        "particles"
    );


/*
   Only 18 particles.
   Much lighter than the previous version.
*/

for(
    let i=0;
    i<18;
    i++
){

    const particle =
        document.createElement(
            "span"
        );


    particle.className =
        "particle";


    particle.style.left =
        Math.random()*100 +
        "%";


    particle.style.animationDelay =
        -(Math.random()*12) +
        "s";


    particle.style.animationDuration =
        (9 + Math.random()*7) +
        "s";


    particleContainer.appendChild(
        particle
    );

}


/* =====================================================
   IMAGE PROTECTION
===================================================== */


/*
   Right click
*/

document.addEventListener(
    "contextmenu",
    event=>{

        event.preventDefault();

    }
);


/*
   Image dragging
*/

document.addEventListener(
    "dragstart",
    event=>{

        if(
            event.target.tagName ===
            "IMG"
        ){

            event.preventDefault();

        }

    }
);


/*
   Text selection
*/

document.addEventListener(
    "selectstart",
    event=>{

        event.preventDefault();

    }
);


/*
   Common save/source shortcuts
*/

document.addEventListener(
    "keydown",
    event=>{

        const key =
            event.key.toLowerCase();


        /* Ctrl + S */

        if(
            event.ctrlKey &&
            key === "s"
        ){

            event.preventDefault();

        }


        /* Ctrl + U */

        if(
            event.ctrlKey &&
            key === "u"
        ){

            event.preventDefault();

        }


        /* Ctrl + P */

        if(
            event.ctrlKey &&
            key === "p"
        ){

            event.preventDefault();

        }


        /* F12 */

        if(
            event.key === "F12"
        ){

            event.preventDefault();

        }


        /* DevTools shortcuts */

        if(
            event.ctrlKey &&
            event.shiftKey &&
            (
                key === "i" ||
                key === "j" ||
                key === "c"
            )
        ){

            event.preventDefault();

        }

    }
);


/*
   Mobile long press / image interaction
*/

document.addEventListener(
    "touchstart",
    event=>{

        if(
            event.target.tagName ===
            "IMG"
        ){

            event.preventDefault();

        }

    },
    {
        passive:false
    }
);


/*
   Prevent middle-click image opening
*/

document.addEventListener(
    "auxclick",
    event=>{

        if(
            event.target.tagName ===
            "IMG"
        ){

            event.preventDefault();

        }

    }
);

</script>

</body>
</html>
