<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio</title>

<meta name="description" content="Creative portfolio - VTuber Models, Logos, Banners and Emotes">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 15% 20%, rgba(125, 70, 255, .16), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(0, 220, 255, .12), transparent 30%),
        #070711;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: linear-gradient(to bottom, black, transparent);
    z-index: -2;
}

.orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: -1;
    opacity: .35;
    animation: floatOrb 8s ease-in-out infinite alternate;
}

.orb.one {
    width: 260px;
    height: 260px;
    background: #7b3cff;
    top: 5%;
    left: -100px;
}

.orb.two {
    width: 220px;
    height: 220px;
    background: #00d9ff;
    right: -80px;
    top: 45%;
    animation-delay: 2s;
}

.orb.three {
    width: 200px;
    height: 200px;
    background: #ff38c7;
    left: 40%;
    bottom: -100px;
    animation-delay: 4s;
}

@keyframes floatOrb {
    from {
        transform: translateY(0) scale(1);
    }

    to {
        transform: translateY(-35px) scale(1.12);
    }
}


/* =========================================================
   NAVBAR
========================================================= */

nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;

    background: rgba(7, 7, 17, .72);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 2px;

    background: linear-gradient(
        90deg,
        #fff,
        #b991ff,
        #62eaff
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.nav-links {
    display: flex;
    gap: 28px;
}

.nav-links a {
    color: rgba(255,255,255,.7);
    text-decoration: none;
    font-size: 14px;
    transition: .3s;
}

.nav-links a:hover {
    color: white;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    max-width: 1200px;
    margin: auto;
    padding: 125px 7% 95px;
    text-align: center;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 9px 16px;
    border-radius: 100px;

    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.1);

    color: #bdaaff;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;

    box-shadow:
        0 0 35px rgba(120,70,255,.1);
}

.badge::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #65f5ff;
    box-shadow: 0 0 14px #65f5ff;
}

.hero h1 {
    margin-top: 28px;

    font-size: clamp(55px, 10vw, 105px);
    line-height: .9;
    letter-spacing: -5px;
    font-weight: 900;

    background:
        linear-gradient(
            120deg,
            #ffffff 15%,
            #b28aff 45%,
            #54eaff 75%,
            #ffffff
        );

    background-size: 200% auto;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: gradientMove 5s linear infinite;
}

@keyframes gradientMove {
    to {
        background-position: 200% center;
    }
}

.hero p {
    max-width: 650px;
    margin: 30px auto 0;

    color: rgba(255,255,255,.58);
    line-height: 1.8;
    font-size: 16px;
}


/* =========================================================
   MAIN
========================================================= */

main {
    max-width: 1250px;
    margin: auto;
    padding: 0 7% 100px;
}

.section-heading {
    margin-bottom: 35px;
}

.kicker {
    color: #9e7bff;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 700;
    margin-bottom: 12px;
}

.section-heading h2 {
    font-size: clamp(34px, 5vw, 58px);
    letter-spacing: -2px;
}

.section-heading p {
    color: rgba(255,255,255,.5);
    margin-top: 12px;
}


/* =========================================================
   FOLDER GRID
========================================================= */

.folder-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
}


/* =========================================================
   PREMIUM FOLDER
========================================================= */

.folder {
    position: relative;
    min-height: 390px;

    border-radius: 28px;
    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.085),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(255,255,255,.11);

    box-shadow:
        0 25px 80px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.06);

    cursor: pointer;

    transform: translateY(0);
    transition:
        transform .45s cubic-bezier(.2,.8,.2,1),
        border-color .45s,
        box-shadow .45s;
}

.folder:hover {
    transform: translateY(-10px);

    border-color: rgba(166,125,255,.55);

    box-shadow:
        0 35px 100px rgba(0,0,0,.45),
        0 0 45px rgba(120,70,255,.13),
        inset 0 1px 0 rgba(255,255,255,.1);
}

.folder-cover {
    position: relative;
    height: 225px;

    background-size: cover;
    background-position: center;

    overflow: hidden;
}

.folder-cover::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            transparent 25%,
            rgba(7,7,17,.2) 55%,
            rgba(7,7,17,.98) 100%
        );

    z-index: 1;
}

.folder-cover::after {
    content: "";
    position: absolute;

    top: -100%;
    left: -100%;

    width: 55%;
    height: 300%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.16),
        transparent
    );

    transform: rotate(25deg);
    transition: left .8s;
    z-index: 2;
}

.folder:hover .folder-cover::after {
    left: 160%;
}

.folder-glow {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(160,120,255,.22),
            transparent 55%
        );

    z-index: 1;
}

.folder-content {
    position: relative;
    padding: 23px 25px 25px;
    z-index: 5;
}

.folder-number {
    position: absolute;
    right: 23px;
    top: 18px;

    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;

    color: rgba(255,255,255,.35);
}

.folder h3 {
    font-size: 27px;
    margin-bottom: 9px;
}

.folder p {
    color: rgba(255,255,255,.52);
    line-height: 1.6;
    font-size: 14px;
    max-width: 80%;
}

.folder-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 23px;

    font-size: 12px;
    color: rgba(255,255,255,.48);
}

.explore {
    color: #c9b5ff;
    font-weight: 700;
    transition: .3s;
}

.folder:hover .explore {
    color: white;
    transform: translateX(5px);
}


/* =========================================================
   GALLERY
========================================================= */

.gallery {
    animation: galleryIn .55s ease both;
}

@keyframes galleryIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.gallery-head {
    margin-bottom: 35px;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 11px 17px;

    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.1);

    color: rgba(255,255,255,.75);

    border-radius: 12px;
    cursor: pointer;

    transition: .3s;
}

.back-btn:hover {
    background: rgba(255,255,255,.1);
    color: white;
    transform: translateX(-3px);
}

.gallery-title {
    margin-top: 28px;
}

.gallery-title h2 {
    font-size: clamp(40px, 6vw, 70px);
    letter-spacing: -3px;
}

.gallery-title p {
    color: rgba(255,255,255,.52);
    margin-top: 10px;
}

.image-grid {
    columns: 3 280px;
    column-gap: 20px;
}

.image-card {
    position: relative;

    display: inline-block;
    width: 100%;

    margin-bottom: 20px;

    border-radius: 20px;
    overflow: hidden;

    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.09);

    cursor: pointer;

    transition:
        transform .4s,
        border-color .4s,
        box-shadow .4s;

    break-inside: avoid;
}

.image-card:hover {
    transform: translateY(-7px) scale(1.01);

    border-color: rgba(167,126,255,.5);

    box-shadow:
        0 25px 70px rgba(0,0,0,.4),
        0 0 30px rgba(120,70,255,.12);
}

.image-card img {
    display: block;
    width: 100%;
    height: auto;

    user-select: none;
    -webkit-user-drag: none;

    transition: transform .6s ease;
}

.image-card:hover img {
    transform: scale(1.035);
}

.image-index {
    position: absolute;
    top: 12px;
    right: 12px;

    padding: 6px 9px;

    border-radius: 9px;

    background: rgba(0,0,0,.55);
    backdrop-filter: blur(10px);

    color: rgba(255,255,255,.75);
    font-size: 11px;
    font-weight: 700;
}


/* =========================================================
   LIGHTBOX
========================================================= */

.lightbox {
    position: fixed;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 30px;

    background: rgba(0,0,0,.9);
    backdrop-filter: blur(18px);

    z-index: 5000;
}

.lightbox.show {
    display: flex;
    animation: fadeIn .25s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

.lightbox img {
    max-width: 92vw;
    max-height: 88vh;

    object-fit: contain;

    border-radius: 15px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.7),
        0 0 50px rgba(120,70,255,.14);
}

.lightbox-close {
    position: fixed;
    top: 22px;
    right: 25px;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.08);

    color: white;
    font-size: 23px;

    cursor: pointer;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    max-width: 1250px;
    margin: auto;
    padding: 30px 7% 45px;

    border-top: 1px solid rgba(255,255,255,.07);

    text-align: center;

    color: rgba(255,255,255,.35);
    font-size: 13px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 800px) {

    nav {
        padding: 0 5%;
    }

    .nav-links {
        gap: 14px;
    }

    .nav-links a {
        font-size: 12px;
    }

    .hero {
        padding-top: 90px;
    }

    .hero h1 {
        letter-spacing: -3px;
    }

    .folder-grid {
        grid-template-columns: 1fr;
    }

    .folder {
        min-height: 370px;
    }

    .image-grid {
        columns: 2 180px;
    }
}

@media (max-width: 500px) {

    nav {
        height: 65px;
    }

    .nav-links {
        display: none;
    }

    .hero {
        padding: 75px 5% 70px;
    }

    main {
        padding-left: 5%;
        padding-right: 5%;
    }

    .folder-cover {
        height: 210px;
    }

    .image-grid {
        columns: 1;
    }
}

</style>
</head>


<body>

<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>


<!-- =======================================================
     NAVIGATION
======================================================= -->

<nav>

    <div class="logo">
        PORTFOLIO
    </div>

    <div class="nav-links">
        <a href="#home">Home</a>
        <a href="#work">Portfolio</a>
    </div>

</nav>


<!-- =======================================================
     HERO
======================================================= -->

<header class="hero" id="home">

    <div class="badge">
        Creative Portfolio
    </div>

    <h1>
        PORTFOLIO
    </h1>

    <p>
        Welcome to my creative portfolio.
        Explore my VTuber models, logo designs,
        banners and custom emotes.
    </p>

</header>


<!-- =======================================================
     MAIN
======================================================= -->

<main id="main">

    <section id="work">

        <div class="section-heading">

            <div class="kicker">
                Selected Work
            </div>

            <h2>
                Explore My Work
            </h2>

            <p>
                Choose a category to view the complete collection.
            </p>

        </div>


        <div
            class="folder-grid"
            id="folders"
        ></div>

    </section>

</main>


<!-- =======================================================
     FOOTER
======================================================= -->

<footer>

    © 2026 Portfolio · All Rights Reserved

</footer>


<!-- =======================================================
     LIGHTBOX
======================================================= -->

<div
    class="lightbox"
    id="lightbox"
>

    <button
        class="lightbox-close"
        id="lightboxClose"
        type="button"
    >
        ×
    </button>

    <img
        id="lightboxImage"
        src=""
        alt="Portfolio Preview"
    >

</div>


<script>

/* =========================================================
   PORTFOLIO DATA
   ALL IMAGES ARE IN THE ROOT OF THE REPOSITORY
========================================================= */

const galleries = {

    vtuber: {
        title: "VTuber Model",
        description: "PNG VTuber model and character design collection",

        images: [
            "Png%20model%201.jpeg",
            "Png%20model%202.jpeg",
            "Png%20model%203.jpeg",
            "Png%20model%204.jpeg",
            "Png%20model%205.jpeg",
            "Png%20model%206.jpeg",
            "Png%20model%207.jpeg",
            "Png%20model%208.jpeg",
            "Png%20model%209.jpeg"
        ]
    },

    logo: {
        title: "Logo",
        description: "Custom logo and visual identity designs",

        images: [
            "logo%201.jpeg",
            "logo%202.jpeg",
            "logo%203.jpeg",
            "logo%204.jpeg",
            "logo%205.jpeg"
        ]
    },

    banner: {
        title: "Banner",
        description: "Professional banners for VTubers, streamers and social media",

        images: [
            "Banner1.jpeg",
            "Banner2.jpeg",
            "Banner3.jpeg",
            "Banner4.jpeg",
            "Banner5.jpeg",
            "Banner6.jpeg",
            "Banner7.jpeg"
        ]
    },

    emotes: {
        title: "Emotes",
        description: "Custom stream and VTuber emote designs",

        images: [
            "Emotes%201.jpeg",
            "Emotes%202.jpeg",
            "Emotes%203.jpeg",
            "Emotes%204.jpeg"
        ]
    }

};


/* =========================================================
   CREATE CATEGORY FOLDERS
========================================================= */

const folders = document.getElementById("folders");

Object.entries(galleries).forEach(
    ([key, gallery], index) => {

        const card = document.createElement("article");

        card.className = "folder";

        card.innerHTML = `

            <div
                class="folder-cover"
                style="
                    background-image:
                    url('${gallery.images[0]}');
                "
            >

                <div class="folder-glow"></div>

            </div>


            <div class="folder-content">

                <div class="folder-number">
                    ${String(index + 1).padStart(2, "0")}
                </div>

                <h3>
                    ${gallery.title}
                </h3>

                <p>
                    ${gallery.description}
                </p>

                <div class="folder-footer">

                    <span>
                        ${gallery.images.length}
                        ${gallery.images.length === 1
                            ? "Project"
                            : "Projects"}
                    </span>

                    <span class="explore">
                        Explore →
                    </span>

                </div>

            </div>

        `;

        card.addEventListener(
            "click",
            () => openGallery(key)
        );

        folders.appendChild(card);

    }
);


/* =========================================================
   OPEN CATEGORY GALLERY
========================================================= */

function openGallery(key) {

    const gallery = galleries[key];

    if (!gallery) {
        return;
    }

    const main = document.getElementById("main");

    main.innerHTML = `

        <section class="gallery">

            <div class="gallery-head">

                <button
                    class="back-btn"
                    type="button"
                    onclick="goHome()"
                >
                    ← Back to Portfolio
                </button>


                <div class="gallery-title">

                    <div class="kicker">
                        Portfolio / ${gallery.title}
                    </div>

                    <h2>
                        ${gallery.title}
                    </h2>

                    <p>
                        ${gallery.description}
                    </p>

                </div>

            </div>


            <div class="image-grid">

                ${gallery.images.map(
                    (image, index) => `

                        <div
                            class="image-card"
                            data-image="${image}"
                        >

                            <img
                                src="${image}"
                                alt="${gallery.title} ${index + 1}"
                                loading="lazy"
                                draggable="false"
                            >

                            <div class="image-index">
                                ${String(index + 1).padStart(2, "0")}
                            </div>

                        </div>

                    `
                ).join("")}

            </div>

        </section>

    `;


    /* Add lightbox events */

    document
        .querySelectorAll(".image-card")
        .forEach(card => {

            card.addEventListener(
                "click",
                () => {

                    const image =
                        card.getAttribute("data-image");

                    openLightbox(image);

                }
            );

        });


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   RETURN TO PORTFOLIO
========================================================= */

function goHome() {

    location.reload();

}


/* =========================================================
   LIGHTBOX
========================================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");


function openLightbox(image) {

    lightboxImage.src = image;

    lightbox.classList.add("show");

    document.body.style.overflow = "hidden";

}


function closeLightbox() {

    lightbox.classList.remove("show");

    lightboxImage.src = "";

    document.body.style.overflow = "";

}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    event => {

        if (event.target === lightbox) {
            closeLightbox();
        }

    }
);


/* =========================================================
   ESC KEY CLOSE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {
            closeLightbox();
        }

    }
);


/* =========================================================
   BASIC IMAGE PROTECTION
========================================================= */

document.addEventListener(
    "contextmenu",
    event => {

        if (
            event.target.tagName === "IMG"
        ) {
            event.preventDefault();
        }

    }
);


document.addEventListener(
    "dragstart",
    event => {

        if (
            event.target.tagName === "IMG"
        ) {
            event.preventDefault();
        }

    }
);

</script>

</body>
</html>
