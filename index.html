<script>

/* =========================================================
   PORTFOLIO DATA
   Images are uploaded directly in the repository root
   ========================================================= */

const galleries = {

    vtuber: {
        title: "VTuber Model",
        desc: "PNG VTuber model and character design collection",

        images: [
            "Png model 1.jpeg",
            "Png model 2.jpeg",
            "Png model 3.jpeg",
            "Png model 4.jpeg",
            "Png model 5.jpeg",
            "Png model 6.jpeg",
            "Png model 7.jpeg",
            "Png model 8.jpeg",
            "Png model 9.jpeg"
        ]
    },

    logo: {
        title: "Logo",
        desc: "Custom logo and visual identity designs",

        images: [
            "logo 1.jpeg",
            "logo 2.jpeg",
            "logo 3.jpeg",
            "logo 4.jpeg",
            "logo 5.jpeg"
        ]
    },

    banner: {
        title: "Banner",
        desc: "Professional banners for VTubers, streamers and social media",

        images: [
            "Banner1.jpeg",
            "Banner2.jpeg",
            "Banner3.jpeg",
            "Banner4.jpeg",
            "Banner5.jpeg",
            "Banner6.jpeg",
            "Banner7.jpeg"
        ]
    },

    emotes: {
        title: "Emotes",
        desc: "Custom stream and VTuber emote designs",

        images: [
            "Emotes 1.jpeg",
            "Emotes 2.jpeg",
            "Emotes 3.jpeg",
            "Emotes 4.jpeg"
        ]
    }

};


/* =========================================================
   CREATE PORTFOLIO FOLDERS
   ========================================================= */

const folders = document.getElementById("folders");

if (folders) {

    folders.innerHTML = "";

    Object.entries(galleries).forEach(
        ([key, gallery], index) => {

            const card = document.createElement("article");

            card.className = "glass folder";

            const coverImage = gallery.images[0];

            card.innerHTML = `

                <div
                    class="folder-cover"
                    style="
                        background-image:
                        url('${coverImage.replace(/'/g, "\\'")}');
                    "
                >
                    <div class="folder-glow"></div>
                </div>

                <div class="folder-content">

                    <div class="folder-number">
                        ${String(index + 1).padStart(2, "0")}
                    </div>

                    <h4>
                        ${gallery.title}
                    </h4>

                    <p>
                        ${gallery.desc}
                    </p>

                    <div class="folder-footer">

                        <span>
                            ${gallery.images.length}
                            ${gallery.images.length === 1 ? "Project" : "Projects"}
                        </span>

                        <span class="open-folder">
                            Explore →
                        </span>

                    </div>

                </div>
            `;

            card.addEventListener(
                "click",
                () => openGallery(key)
            );

            folders.appendChild(card);
        }
    );
}


/* =========================================================
   OPEN GALLERY
   ========================================================= */

function openGallery(key) {

    const gallery = galleries[key];

    if (!gallery) return;

    const main = document.getElementById("main");

    if (!main) return;

    main.innerHTML = `

        <section class="gallery active">

            <div class="gallery-head">

                <div>

                    <button
                        class="back"
                        onclick="goHome()"
                        type="button"
                    >
                        ← Back to Portfolio
                    </button>

                    <div
                        class="kicker"
                        style="margin-top:24px"
                    >
                        Portfolio / ${gallery.title}
                    </div>

                    <h2>
                        ${gallery.title}
                    </h2>

                    <p>
                        ${gallery.desc}
                    </p>

                </div>

            </div>


            <div class="images">

                ${gallery.images.map(
                    (image, index) => `

                        <div
                            class="image-card"
                            data-image="${image.replace(/"/g, "&quot;")}"
                        >

                            <img
                                src="${image.replace(/"/g, "&quot;")}"
                                alt="${gallery.title} ${index + 1}"
                                loading="lazy"
                                draggable="false"
                            >

                            <div class="image-number">
                                ${String(index + 1).padStart(2, "0")}
                            </div>

                        </div>

                    `
                ).join("")}

            </div>

        </section>

    `;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   GO HOME
   ========================================================= */

function goHome() {

    window.location.reload();

}

</script>
