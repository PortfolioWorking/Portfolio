<script>

/* =========================================================
   PORTFOLIO DATA
   ========================================================= */

const galleries = {

    vtuber: {

        title: "VTuber Model",

        desc: "PNG VTuber model and character design collection",

        images: [

            "VTuber/Png%20model%201.jpeg",
            "VTuber/Png%20model%202.jpeg",
            "VTuber/Png%20model%203.jpeg",
            "VTuber/Png%20model%204.jpeg",
            "VTuber/Png%20model%205.jpeg",
            "VTuber/Png%20model%206.jpeg",
            "VTuber/Png%20model%207.jpeg",
            "VTuber/Png%20model%208.jpeg",
            "VTuber/Png%20model%209.jpeg"

        ]

    },


    logo: {

        title: "Logo Design",

        desc: "Custom logo and visual identity designs",

        images: [

            "Logo/logo%201.jpeg",
            "Logo/logo%202.jpeg",
            "Logo/logo%203.jpeg",
            "Logo/logo%204.jpeg",
            "Logo/logo%205.jpeg"

        ]

    },


    banner: {

        title: "Banner Design",

        desc: "Professional banners for VTubers, streamers and social media",

        images: [

            "Banner/Banner1.jpeg",
            "Banner/Banner2.jpeg",
            "Banner/Banner3.jpeg",
            "Banner/Banner4.jpeg",
            "Banner/Banner5.jpeg",
            "Banner/Banner6.jpeg",
            "Banner/Banner7.jpeg"

        ]

    },


    emotes: {

        title: "Emotes",

        desc: "Custom stream and VTuber emote designs",

        images: [

            "Emotes/Emotes%201.jpeg",
            "Emotes/Emotes%202.jpeg",
            "Emotes/Emotes%203.jpeg",
            "Emotes/Emotes%204.jpeg"

        ]

    }

};


/* =========================================================
   CREATE PREMIUM PORTFOLIO FOLDERS
   ========================================================= */

const folders =
    document.getElementById("folders");


Object.entries(galleries).forEach(
    ([key, gallery], index) => {

        const card =
            document.createElement("article");


        card.className =
            "glass folder";


        const coverImage =
            gallery.images[0];


        card.innerHTML = `

            <div
                class="folder-cover"
                style="
                    background-image:
                    url('${coverImage}');
                "
            >

                <div class="folder-glow"></div>

            </div>


            <div class="folder-content">

                <div class="folder-number">

                    ${String(index + 1).padStart(2, "0")}

                </div>


                <h4>

                    ${gallery.title}

                </h4>


                <p>

                    ${gallery.desc}

                </p>


                <div class="folder-footer">

                    <span>

                        ${gallery.images.length}
                        Projects

                    </span>

                    <span class="open-folder">

                        Explore →

                    </span>

                </div>

            </div>

        `;


        card.addEventListener(
            "click",
            () => openGallery(key)
        );


        folders.appendChild(card);

    }
);


/* =========================================================
   OPEN GALLERY
   ========================================================= */

function openGallery(key) {

    const gallery =
        galleries[key];


    const main =
        document.getElementById("main");


    main.innerHTML = `

        <section
            class="gallery active"
        >

            <div
                class="gallery-head"
            >

                <div>

                    <button
                        class="back"
                        onclick="goHome()"
                    >

                        ← Back to Portfolio

                    </button>


                    <div
                        class="kicker"
                        style="margin-top:24px"
                    >

                        Portfolio /
                        ${gallery.title}

                    </div>


                    <h2>

                        ${gallery.title}

                    </h2>


                    <p>

                        ${gallery.desc}

                    </p>

                </div>

            </div>


            <div class="images">

                ${gallery.images.map(
                    (image,index) => `

                        <div
                            class="image-card"
                            data-image="${image}"
                        >

                            <img
                                src="${image}"
                                alt="${gallery.title} ${index + 1}"
                                loading="lazy"
                                draggable="false"
                            >

                            <div class="image-number">

                                ${String(index + 1).padStart(2, "0")}

                            </div>

                        </div>

                    `
                ).join("")}

            </div>

        </section>

    `;


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================================================
   GO HOME
   ========================================================= */

function goHome() {

    window.location.reload();

}

</script>
