<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PORTFOLIO</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:#050508;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

/* =========================================================
   BACKGROUND
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-5;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(100,70,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 25%,
            rgba(0,220,255,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(255,0,160,.10),
            transparent 35%
        );
}

/* moving aurora */

.aurora{
    position:fixed;
    inset:-20%;
    z-index:-4;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at 30% 30%,
            rgba(110,80,255,.13),
            transparent 40%
        ),
        radial-gradient(
            ellipse at 70% 60%,
            rgba(0,210,255,.09),
            transparent 40%
        ),
        radial-gradient(
            ellipse at 50% 90%,
            rgba(255,0,170,.08),
            transparent 35%
        );

    filter:blur(60px);

    animation:
        auroraMove 14s ease-in-out infinite alternate;
}

@keyframes auroraMove{

    0%{
        transform:
            translate(-3%, -2%)
            scale(1);
    }

    50%{
        transform:
            translate(3%, 2%)
            scale(1.08);
    }

    100%{
        transform:
            translate(-2%, 4%)
            scale(1.03);
    }
}

/* =========================================================
   PARTICLES
========================================================= */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;
    overflow:hidden;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:rgba(255,255,255,.75);

    box-shadow:
        0 0 8px rgba(255,255,255,.7);

    animation:
        particleFloat linear infinite;
}

@keyframes particleFloat{

    from{
        transform:
            translateY(110vh)
            translateX(0);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    80%{
        opacity:.45;
    }

    to{
        transform:
            translateY(-15vh)
            translateX(40px);
        opacity:0;
    }
}

/* =========================================================
   CURSOR GLOW
========================================================= */

.cursor-glow{
    position:fixed;
    width:260px;
    height:260px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    pointer-events:none;
    z-index:9990;

    background:
        radial-gradient(
            circle,
            rgba(120,100,255,.12),
            rgba(80,180,255,.05) 35%,
            transparent 70%
        );

    filter:blur(10px);
}

/* =========================================================
   MAIN
========================================================= */

main{
    width:100%;
    min-height:100vh;
    position:relative;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:88vh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:80px 20px 50px;

    position:relative;
}

/* small top label */

.hero-label{
    position:relative;
    z-index:10;

    font-size:11px;
    letter-spacing:7px;
    text-transform:uppercase;

    color:rgba(255,255,255,.55);

    margin-bottom:25px;

    animation:
        fadeDown 1.2s ease both;
}

@keyframes fadeDown{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   PORTFOLIO TITLE
========================================================= */

.title-wrap{

    --lens-x:50%;
    --lens-y:30%;

    position:relative;

    width:min(700px,90vw);

    height:390px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:visible;

    isolation:isolate;
}

/* normal title */

.title-normal{

    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    z-index:2;

    pointer-events:none;
}

/* IMPORTANT:
   exact two words with small gap */

.word{

    display:block;

    font-size:
        clamp(72px, 15vw, 175px);

    line-height:.82;

    font-weight:900;

    letter-spacing:
        clamp(4px,1vw,12px);

    text-transform:uppercase;

    color:#fff;

    text-align:center;

    white-space:nowrap;

    text-shadow:
        0 0 30px rgba(255,255,255,.08);

    animation:
        titleFloat 5s ease-in-out infinite;
}

.word:first-child{
    margin-bottom:20px;
}

.word:nth-child(2){
    animation-delay:-2.5s;
}

@keyframes titleFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }
}

/* =========================================================
   REFRACTED TEXT
========================================================= */

.title-refract{

    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    z-index:4;

    pointer-events:none;

    clip-path:
        circle(
            var(--lens-radius,90px)
            at
            var(--lens-x)
            var(--lens-y)
        );

    filter:
        blur(.7px)
        saturate(1.35);

    transform:
        scale(1.055);

    mix-blend-mode:screen;
}

.title-refract .word{

    color:#fff;

    text-shadow:
        -3px 0 rgba(255,0,80,.65),
         3px 0 rgba(0,210,255,.65),
         0 0 18px rgba(255,255,255,.25);
}

/* =========================================================
   GLASS LENS
========================================================= */

.glass-lens{

    position:absolute;

    width:
        var(--lens-size,180px);

    height:
        var(--lens-size,180px);

    left:
        var(--lens-x);

    top:
        var(--lens-y);

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    z-index:7;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 35% 25%,
            rgba(255,255,255,.20),
            rgba(255,255,255,.07) 28%,
            rgba(100,180,255,.045) 52%,
            rgba(255,255,255,.02) 70%,
            transparent 75%
        );

    border:
        1px solid rgba(255,255,255,.55);

    box-shadow:
        inset 0 0 25px rgba(255,255,255,.08),
        inset 0 0 60px rgba(80,180,255,.08),
        0 0 20px rgba(130,170,255,.12);

    backdrop-filter:
        blur(2px);

    -webkit-backdrop-filter:
        blur(2px);

    overflow:hidden;

    transition:
        width .3s ease,
        height .3s ease;
}

/* glass reflection */

.glass-lens::before{

    content:"";

    position:absolute;

    width:55%;
    height:25%;

    top:13%;
    left:18%;

    border-radius:50%;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.35),
            transparent
        );

    filter:blur(4px);

    transform:rotate(-25deg);

    opacity:.65;
}

/* RGB edge */

.glass-lens::after{

    content:"";

    position:absolute;
    inset:0;

    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            rgba(255,0,90,.14),
            rgba(0,220,255,.14),
            rgba(150,80,255,.14),
            rgba(255,0,90,.14)
        );

    mix-blend-mode:screen;

    opacity:.6;

    animation:
        lensRGB 5s linear infinite;
}

@keyframes lensRGB{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   SUBTITLE
========================================================= */

.hero-subtitle{

    margin-top:10px;

    text-align:center;

    color:rgba(255,255,255,.48);

    font-size:
        clamp(11px,1.5vw,14px);

    letter-spacing:
        clamp(3px,1vw,7px);

    text-transform:uppercase;

    animation:
        fadeUp 1.4s ease .3s both;
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   CATEGORY AREA
========================================================= */

.portfolio-section{

    width:min(1250px,92%);

    margin:
        0 auto;

    padding:
        20px 0 100px;
}

.section-heading{

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:35px;
}

.section-heading h2{

    font-size:12px;

    letter-spacing:5px;

    color:rgba(255,255,255,.55);

    text-transform:uppercase;
}

.section-line{

    height:1px;

    flex:1;

    margin-left:25px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.18),
            transparent
        );
}

/* =========================================================
   CATEGORY GRID
========================================================= */

.folder-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:35px;

    perspective:1400px;
}

/* =========================================================
   FOLDER CARD
========================================================= */

.folder-card{

    height:300px;

    position:relative;

    cursor:pointer;

    perspective:1000px;

    animation:
        cardAppear .8s ease both;

    transform-style:preserve-3d;

    transition:
        transform .35s cubic-bezier(.2,.8,.2,1);
}

.folder-card:nth-child(2){
    animation-delay:.08s;
}

.folder-card:nth-child(3){
    animation-delay:.16s;
}

.folder-card:nth-child(4){
    animation-delay:.24s;
}

.folder-card:nth-child(5){
    animation-delay:.32s;
}

.folder-card:nth-child(6){
    animation-delay:.40s;
}

@keyframes cardAppear{

    from{
        opacity:0;
        transform:
            translateY(40px)
            rotateX(8deg);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            rotateX(0);
    }
}

/* =========================================================
   FOLDER BODY
========================================================= */

.folder-body{

    position:absolute;

    inset:
        15px 0 0;

    border-radius:
        20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.035)
        );

    border:
        1px solid rgba(255,255,255,.14);

    box-shadow:
        0 25px 60px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.08);

    transform:
        translateZ(20px);

    transform-style:preserve-3d;

    overflow:hidden;

    transition:
        .45s cubic-bezier(.2,.8,.2,1);
}

/* =========================================================
   FOLDER TAB
========================================================= */

.folder-tab{

    position:absolute;

    top:-2px;
    left:18px;

    width:115px;
    height:30px;

    border-radius:
        12px 12px 0 0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.055)
        );

    border:
        1px solid rgba(255,255,255,.14);

    border-bottom:none;

    transform:
        translateZ(32px);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1);

    z-index:5;
}

/* =========================================================
   IMAGE PREVIEW
========================================================= */

.folder-preview{

    position:absolute;

    top:42px;
    left:18px;
    right:18px;
    bottom:62px;

    border-radius:
        13px;

    overflow:hidden;

    background:
        rgba(0,0,0,.08);

    border:
        1px solid rgba(255,255,255,.08);

    transform:
        translateZ(38px);

    transition:
        transform .45s ease;
}

.folder-preview img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    opacity:1 !important;

    filter:none !important;

    user-select:none;

    -webkit-user-drag:none;

    pointer-events:none;

    transition:
        transform .6s cubic-bezier(.2,.8,.2,1);
}

/* =========================================================
   FOLDER BOTTOM
========================================================= */

.folder-bottom{

    position:absolute;

    left:20px;
    right:20px;
    bottom:19px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    transform:
        translateZ(45px);

    z-index:5;
}

.folder-name{

    font-size:15px;

    font-weight:700;

    letter-spacing:.5px;

    color:#fff;

    transition:
        letter-spacing .4s ease,
        transform .4s ease;
}

.folder-arrow{

    width:30px;
    height:30px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.16);

    color:rgba(255,255,255,.75);

    transition:
        .4s ease;
}

/* =========================================================
   SHINE
========================================================= */

.folder-shine{

    position:absolute;

    inset:-100%;

    z-index:10;

    pointer-events:none;

    background:
        linear-gradient(
            120deg,
            transparent 40%,
            rgba(255,255,255,.13) 50%,
            transparent 60%
        );

    transform:
        translateX(-60%)
        rotate(8deg);

    transition:
        transform .8s ease;
}

/* =========================================================
   HOVER FOLDER
========================================================= */

.folder-card:hover .folder-body{

    transform:
        translateZ(40px)
        rotateX(3deg)
        rotateY(-3deg)
        translateY(-8px);

    border-color:
        rgba(255,255,255,.25);

    box-shadow:
        0 35px 80px rgba(0,0,0,.5),
        0 0 35px rgba(120,120,255,.08),
        inset 0 1px 0 rgba(255,255,255,.12);
}

.folder-card:hover .folder-preview img{

    transform:
        scale(1.045);
}

.folder-card:hover .folder-shine{

    transform:
        translateX(60%)
        rotate(8deg);
}

.folder-card:hover .folder-name{

    letter-spacing:1.5px;

    transform:
        translateX(3px);
}

.folder-card:hover .folder-arrow{

    transform:
        translateX(4px)
        rotate(-45deg);

    background:
        rgba(255,255,255,.08);
}

/* =========================================================
   CATEGORY VIEW
========================================================= */

.category-view{

    display:none;

    min-height:100vh;

    padding:
        70px 5% 100px;

    animation:
        viewIn .5s ease both;
}

.category-view.active{
    display:block;
}

@keyframes viewIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* category header */

.category-header{

    max-width:1300px;

    margin:
        0 auto 45px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:25px;
}

.category-title{

    font-size:
        clamp(32px,6vw,72px);

    font-weight:900;

    letter-spacing:-2px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #aeb7ff,
            #fff
        );

    background-size:200% auto;

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:
        titleGradient 5s linear infinite;
}

@keyframes titleGradient{

    from{
        background-position:0% center;
    }

    to{
        background-position:200% center;
    }
}

/* back button */

.back-button{

    flex-shrink:0;

    border:
        1px solid rgba(255,255,255,.18);

    background:
        rgba(255,255,255,.055);

    color:#fff;

    padding:
        12px 20px;

    border-radius:
        999px;

    cursor:pointer;

    font-size:12px;

    letter-spacing:2px;

    text-transform:uppercase;

    transition:
        .35s ease;
}

.back-button:hover{

    background:
        rgba(255,255,255,.12);

    border-color:
        rgba(255,255,255,.35);

    transform:
        translateX(-4px);
}

/* =========================================================
   IMAGE GALLERY
========================================================= */

.gallery{

    max-width:1300px;

    margin:0 auto;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}

.gallery-item{

    position:relative;

    min-height:260px;

    border-radius:
        16px;

    overflow:hidden;

    cursor:pointer;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.12);

    animation:
        galleryAppear .7s ease both;

    transition:
        transform .4s ease,
        border-color .4s ease,
        box-shadow .4s ease;
}

@keyframes galleryAppear{

    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.gallery-item:hover{

    transform:
        translateY(-7px);

    border-color:
        rgba(255,255,255,.27);

    box-shadow:
        0 25px 55px rgba(0,0,0,.4);
}

.gallery-item img{

    width:100%;
    height:100%;

    min-height:260px;

    object-fit:contain;

    display:block;

    background:
        rgba(0,0,0,.08);

    filter:none !important;

    opacity:1 !important;

    transition:
        transform .5s ease;
}

.gallery-item:hover img{

    transform:
        scale(1.025);
}

/* image shine */

.gallery-item::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            120deg,
            transparent 35%,
            rgba(255,255,255,.09) 50%,
            transparent 65%
        );

    transform:
        translateX(-120%);

    transition:
        transform .7s ease;
}

.gallery-item:hover::after{

    transform:
        translateX(120%);
}

/* =========================================================
   LIGHTBOX
========================================================= */

.lightbox{

    position:fixed;

    inset:0;

    z-index:10000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:30px;

    background:
        rgba(3,3,8,.92);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);
}

.lightbox.active{
    display:flex;
}

.lightbox img{

    max-width:
        94vw;

    max-height:
        88vh;

    object-fit:contain;

    border-radius:
        10px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.7),
        0 0 40px rgba(120,130,255,.08);

    user-select:none;

    -webkit-user-drag:none;

    pointer-events:none;

    animation:
        lightboxIn .35s ease both;
}

@keyframes lightboxIn{

    from{
        opacity:0;
        transform:
            scale(.94);
    }

    to{
        opacity:1;
        transform:
            scale(1);
    }
}

.lightbox-close{

    position:absolute;

    top:25px;
    right:30px;

    width:45px;
    height:45px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid rgba(255,255,255,.16);

    color:#fff;

    font-size:22px;

    cursor:pointer;

    transition:
        .3s ease;
}

.lightbox-close:hover{

    background:
        rgba(255,255,255,.15);

    transform:
        rotate(90deg);
}

/* =========================================================
   FOOTER
========================================================= */

footer{

    text-align:center;

    padding:
        20px 20px 45px;

    color:
        rgba(255,255,255,.25);

    font-size:10px;

    letter-spacing:3px;

    text-transform:uppercase;
}

/* =========================================================
   PROTECTION OVERLAY
========================================================= */

.protection-layer{

    position:fixed;

    inset:0;

    z-index:9998;

    pointer-events:none;

    background:
        transparent;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    .folder-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .gallery{
        grid-template-columns:
            repeat(2,1fr);
    }

    .title-wrap{
        height:310px;
    }

    .glass-lens{
        --lens-size:130px;
    }

}

@media(max-width:600px){

    .hero{
        min-height:78vh;
        padding-top:55px;
    }

    .hero-label{
        letter-spacing:4px;
        margin-bottom:15px;
    }

    .title-wrap{
        width:96vw;
        height:245px;
    }

    .word{
        font-size:
            clamp(58px,19vw,100px);

        letter-spacing:3px;
    }

    .word:first-child{
        margin-bottom:12px;
    }

    .glass-lens{
        --lens-size:100px;
    }

    .hero-subtitle{
        font-size:9px;
        letter-spacing:3px;
    }

    .folder-grid{
        grid-template-columns:1fr;
        gap:25px;
    }

    .folder-card{
        height:280px;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .category-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .back-button{
        order:-1;
    }

    .category-title{
        font-size:42px;
    }

    .category-view{
        padding-top:35px;
    }

}

</style>
</head>


<body>

<!-- ======================================================
     BACKGROUND
====================================================== -->

<div class="aurora"></div>

<div class="particles" id="particles"></div>

<div class="cursor-glow" id="cursorGlow"></div>

<div class="protection-layer"></div>


<!-- ======================================================
     MAIN PORTFOLIO HOME
====================================================== -->

<main id="homePage">

<section class="hero">

    <div class="hero-label">
        Creative Visual Portfolio
    </div>


    <!-- ==================================================
         PORT / FOLIO TITLE
    ================================================== -->

    <div
        class="title-wrap"
        id="titleWrap"
    >

        <!-- normal sharp typography -->

        <div class="title-normal">

            <span class="word">
                PORT
            </span>

            <span class="word">
                FOLIO

<script>

/* =========================================================
   IMAGE DATA
========================================================= */

const categories = {

    "VTuber Model":[

        "Png model 1.jpeg",
        "Png model 2.jpeg",
        "Png model 3.jpeg",
        "Png model 4.jpeg",
        "Png model 5.jpeg",
        "Png model 6.jpeg",
        "Png model 7.jpeg",
        "Png model 8.jpeg"

    ],

    "Logo":[

        "logo 1.jpeg",
        "logo4.jpeg",
        "logo5.jpeg",
        "Logo2.jpeg",
        "Logo3.jpeg"

    ],

    "Banner":[

        "Banner1.jpeg",
        "Banner3.jpeg",
        "Banner7.jpeg",
        "Banner6.jpeg",
        "banner5.jpeg",
        "banner4.jpeg",
        "banner2.jpeg"

    ],

    "Emotes":[

        "Emotes 1.jpeg",
        "Emotes 2.jpeg",
        "Emotes 3.jpeg",
        "Emotes 4.jpeg"

    ],

    "Artscene":[

        "Artscene 1.jpeg"

    ],

    "Overlay":[

        "Overlay 1.jpeg"

    ]

};


/* =========================================================
   ELEMENTS
========================================================= */

const homePage =
    document.getElementById("homePage");

const categoryView =
    document.getElementById("categoryView");

const categoryTitle =
    document.getElementById("categoryTitle");

const gallery =
    document.getElementById("gallery");

const backButton =
    document.getElementById("backButton");

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const titleWrap =
    document.getElementById("titleWrap");

const words =
    [...document.querySelectorAll(
        ".title-normal .word"
    )];


/* =========================================================
   IMAGE PATH
========================================================= */

function imagePath(file){

    return encodeURI(file);

}


/* =========================================================
   OPEN CATEGORY
========================================================= */

function openCategory(category){

    homePage.style.display =
        "none";

    categoryView.classList.add(
        "active"
    );

    categoryTitle.textContent =
        category;

    gallery.innerHTML = "";

    const images =
        categories[category] || [];


    images.forEach(
        (file,index)=>{

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "gallery-item";

            item.style.animationDelay =
                `${index * 0.06}s`;


            const img =
                document.createElement(
                    "img"
                );

            img.src =
                imagePath(file);

            img.alt =
                category;

            img.draggable =
                false;


            item.appendChild(img);

            gallery.appendChild(item);


            /* open lightbox */

            item.addEventListener(
                "click",
                ()=>{
                    openLightbox(
                        imagePath(file)
                    );
                }
            );

        }
    );


    window.scrollTo({
        top:0,
        behavior:"instant"
    });

}


/* =========================================================
   BACK TO HOME
========================================================= */

function goHome(){

    categoryView.classList.remove(
        "active"
    );

    homePage.style.display =
        "block";

    window.scrollTo({
        top:0,
        behavior:"instant"
    });

}


backButton.addEventListener(
    "click",
    goHome
);


/* =========================================================
   FOLDER CLICK
========================================================= */

document
.querySelectorAll(".folder-card")
.forEach(card=>{

    card.addEventListener(
        "click",
        ()=>{

            const category =
                card.dataset.category;

            openCategory(category);

        }
    );

});


/* =========================================================
   LIGHTBOX
========================================================= */

function openLightbox(src){

    lightboxImage.src =
        src;

    lightbox.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";

}


function closeLightbox(){

    lightbox.classList.remove(
        "active"
    );

    lightboxImage.src =
        "";

    document.body.style.overflow =
        "";

}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    event=>{

        if(
            event.target === lightbox
        ){

            closeLightbox();

        }

    }
);


/* =========================================================
   ESC CLOSE
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Escape"
        ){

            closeLightbox();

        }

    }
);


/* =========================================================
   PREMIUM PORT/FOLIO LENS
   IMPORTANT:
   Lens moves between the actual PORT and FOLIO
   text positions only.
========================================================= */

let lensStart =
    performance.now();


function animateLens(now){

    const elapsed =
        (now - lensStart) / 1000;


    const wrapRect =
        titleWrap.getBoundingClientRect();


    const wordRects =
        words.map(
            word =>
                word.getBoundingClientRect()
        );


    if(
        wordRects.length < 2 ||
        wrapRect.height <= 0
    ){

        requestAnimationFrame(
            animateLens
        );

        return;

    }


    /*
       Smooth 0 → 1 → 0 movement.

       This means:

       PORT
         ↓
       FOLIO
         ↓
       PORT

       The lens center never wanders
       into the empty page area.
    */

    const phase =
        (
            Math.sin(
                elapsed * 0.62
            ) + 1
        ) / 2;


    const portRect =
        wordRects[0];

    const folioRect =
        wordRects[1];


    const portCenterY =
        portRect.top +
        portRect.height / 2;


    const folioCenterY =
        folioRect.top +
        folioRect.height / 2;


    /*
       Exact vertical position
       between PORT and FOLIO.
    */

    const lensCenterY =
        portCenterY +
        (
            folioCenterY -
            portCenterY
        ) *
        phase;


    const lensY =
        (
            (
                lensCenterY -
                wrapRect.top
            )
            /
            wrapRect.height
        )
        * 100;


    /*
       Keep lens horizontally
       over the typography.

       Very subtle side movement only.
    */

    const lensX =
        50 +
        Math.sin(
            elapsed * 0.42
        ) * 5;


    titleWrap.style.setProperty(
        "--lens-x",
        lensX + "%"
    );


    titleWrap.style.setProperty(
        "--lens-y",
        lensY + "%"
    );


    requestAnimationFrame(
        animateLens
    );

}


requestAnimationFrame(
    animateLens
);


/* =========================================================
   FOLDER 3D TILT
========================================================= */

document
.querySelectorAll(".folder-card")
.forEach(card=>{

    card.addEventListener(
        "mousemove",
        event=>{

            const rect =
                card.getBoundingClientRect();


            const x =
                event.clientX -
                rect.left;


            const y =
                event.clientY -
                rect.top;


            const centerX =
                rect.width / 2;


            const centerY =
                rect.height / 2;


            const rotateY =
                (
                    (x - centerX)
                    /
                    centerX
                ) * 5;


            const rotateX =
                -(
                    (y - centerY)
                    /
                    centerY
                ) * 5;


            card.style.transform =
                `
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                translateY(-4px)
                scale(1.01)
                `;

        }
    );


    card.addEventListener(
        "mouseleave",
        ()=>{

            card.style.transform =
                "";

        }
    );

});


/* =========================================================
   CURSOR GLOW
========================================================= */

const cursorGlow =
    document.getElementById(
        "cursorGlow"
    );


document.addEventListener(
    "mousemove",
    event=>{

        cursorGlow.style.left =
            event.clientX + "px";

        cursorGlow.style.top =
            event.clientY + "px";

    }
);


/* =========================================================
   PARTICLES
========================================================= */

const particles =
    document.getElementById(
        "particles"
    );


for(
    let i=0;
    i<55;
    i++
){

    const particle =
        document.createElement(
            "div"
        );

    particle.className =
        "particle";


    particle.style.left =
        Math.random() * 100 + "%";


    particle.style.animationDuration =
        (8 + Math.random()*12) + "s";


    particle.style.animationDelay =
        (-Math.random()*15) + "s";


    particle.style.opacity =
        .2 +
        Math.random()*.7;


    particle.style.transform =
        `scale(${.5 + Math.random()*1.5})`;


    particles.appendChild(
        particle
    );

}


/* =========================================================
   IMAGE PROTECTION
   NOTE:
   This is deterrence only. Screenshots and browser
   developer tools can never be completely blocked.
========================================================= */


/* disable right click */

document.addEventListener(
    "contextmenu",
    event=>{
        event.preventDefault();
    }
);


/* disable image dragging */

document.addEventListener(
    "dragstart",
    event=>{

        if(
            event.target.tagName ===
            "IMG"
        ){

            event.preventDefault();

        }

    }
);


/* disable text selection */

document.addEventListener(
    "selectstart",
    event=>{

        event.preventDefault();

    }
);


/* common save / source / devtools shortcuts */

document.addEventListener(
    "keydown",
    event=>{

        const key =
            event.key.toLowerCase();


        /*
           Ctrl+S
        */

        if(
            event.ctrlKey &&
            key === "s"
        ){

            event.preventDefault();
            return;

        }


        /*
           Ctrl+U
        */

        if(
            event.ctrlKey &&
            key === "u"
        ){

            event.preventDefault();
            return;

        }


        /*
           Ctrl+Shift+I
           Ctrl+Shift+J
           Ctrl+Shift+C
        */

        if(
            event.ctrlKey &&
            event.shiftKey &&
            (
                key === "i" ||
                key === "j" ||
                key === "c"
            )
        ){

            event.preventDefault();
            return;

        }


        /*
           F12
        */

        if(
            event.key === "F12"
        ){

            event.preventDefault();
            return;

        }


        /*
           Ctrl+P
        */

        if(
            event.ctrlKey &&
            key === "p"
        ){

            event.preventDefault();
            return;

        }

    }
);


/* =========================================================
   MOBILE LONG PRESS DETERRENCE
========================================================= */

document.addEventListener(
    "touchstart",
    event=>{

        if(
            event.target.tagName ===
            "IMG"
        ){

            event.preventDefault();

        }

    },
    {
        passive:false
    }
);


/* =========================================================
   PREVENT IMAGE OPEN IN NEW TAB
========================================================= */

document.addEventListener(
    "auxclick",
    event=>{

        if(
            event.target.tagName ===
            "IMG"
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   HISTORY / BACK BUTTON SUPPORT
========================================================= */

window.addEventListener(
    "popstate",
    ()=>{

        goHome();

    }
);


/* =========================================================
   FINISH
========================================================= */

console.log(
    "Portfolio loaded."
);

</script>
