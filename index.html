<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio — Creative Design</title>

<meta name="description" content="Creative portfolio featuring VTuber Models, Logo Design, Banner Design and Emotes.">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    color: #ffffff;

    min-height: 100vh;

    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(130, 75, 255, .20),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 30%,
            rgba(0, 220, 255, .13),
            transparent 27%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(255, 50, 200, .10),
            transparent 30%
        ),
        #05050b;
}


/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            transparent 90%
        );

    z-index: -5;
}


/* =========================================================
   FLOATING LIGHTS
========================================================= */

.light {
    position: fixed;

    border-radius: 50%;

    pointer-events: none;

    filter: blur(80px);

    opacity: .30;

    z-index: -4;

    animation:
        floatingLight 10s ease-in-out infinite alternate;
}

.light-1 {
    width: 300px;
    height: 300px;

    background: #783cff;

    top: -100px;
    left: -100px;
}

.light-2 {
    width: 250px;
    height: 250px;

    background: #00d9ff;

    right: -100px;
    top: 35%;

    animation-delay: 2s;
}

.light-3 {
    width: 280px;
    height: 280px;

    background: #ff31c7;

    left: 35%;
    bottom: -150px;

    animation-delay: 4s;
}

@keyframes floatingLight {

    from {
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    to {
        transform:
            translate3d(0,-45px,0)
            scale(1.15);
    }
}


/* =========================================================
   NAVIGATION
========================================================= */

.navbar {
    position: sticky;

    top: 0;

    z-index: 2000;

    height: 76px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 7%;

    background:
        rgba(5,5,11,.70);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 10px 40px rgba(0,0,0,.18);
}

.brand {
    font-size: 21px;

    font-weight: 900;

    letter-spacing: 3px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #b88cff,
            #59eaff,
            #ffffff
        );

    background-size: 250% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        brandGradient 5s linear infinite;
}

@keyframes brandGradient {

    to {
        background-position:
            250% center;
    }
}

.nav-menu {
    display: flex;

    align-items: center;

    gap: 30px;
}

.nav-menu a {
    position: relative;

    color:
        rgba(255,255,255,.65);

    text-decoration: none;

    font-size: 13px;

    transition:
        color .3s ease;
}

.nav-menu a::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -8px;

    width: 0;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            #9c6cff,
            #56eaff
        );

    transition:
        width .3s ease;
}

.nav-menu a:hover {
    color: #ffffff;
}

.nav-menu a:hover::after {
    width: 100%;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;

    max-width: 1200px;

    margin: auto;

    padding:
        135px
        7%
        115px;

    text-align: center;
}

.hero-badge {
    display: inline-flex;

    align-items: center;

    gap: 9px;

    padding:
        10px
        17px;

    border-radius: 100px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.11);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.06),
        0 0 35px
        rgba(130,70,255,.10);

    color:
        rgba(220,205,255,.90);

    font-size: 11px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 3px;
}

.hero-badge span {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #6ff5ff;

    box-shadow:
        0 0 16px
        #6ff5ff;

    animation:
        pulseDot 1.8s infinite;
}

@keyframes pulseDot {

    0%,100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .45;
        transform: scale(.7);
    }
}

.hero h1 {
    margin-top: 30px;

    font-size:
        clamp(58px, 11vw, 125px);

    line-height: .88;

    font-weight: 950;

    letter-spacing: -7px;

    background:
        linear-gradient(
            115deg,
            #ffffff 5%,
            #c7a8ff 30%,
            #6deaff 55%,
            #ffffff 80%,
            #b993ff
        );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        heroGradient 7s linear infinite;
}

@keyframes heroGradient {

    to {
        background-position:
            300% center;
    }
}

.hero h1::selection {
    color: #ffffff;
    background: #7448ff;
}

.hero-description {
    max-width: 680px;

    margin:
        35px
        auto
        0;

    color:
        rgba(255,255,255,.52);

    font-size: 16px;

    line-height: 1.9;
}


/* =========================================================
   SECTION
========================================================= */

.main {
    max-width: 1250px;

    margin: auto;

    padding:
        0
        7%
        110px;
}

.section-top {
    margin-bottom: 38px;
}

.eyebrow {
    color: #a783ff;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 13px;
}

.section-top h2 {
    font-size:
        clamp(38px, 6vw, 65px);

    letter-spacing: -3px;

    line-height: 1;
}

.section-top p {
    color:
        rgba(255,255,255,.45);

    margin-top: 14px;

    line-height: 1.7;
}


/* =========================================================
   PREMIUM CATEGORY GRID
========================================================= */

.category-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 24px;
}


/* =========================================================
   CATEGORY CARD
========================================================= */

.category {
    position: relative;

    min-height: 425px;

    overflow: hidden;

    cursor: pointer;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.095),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.11);

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.32),

        inset 0 1px 0
        rgba(255,255,255,.07);

    transition:
        transform .5s
        cubic-bezier(.2,.8,.2,1),

        border-color .5s,

        box-shadow .5s;
}

.category::before {
    content: "";

    position: absolute;

    inset: 0;

    opacity: 0;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(155,105,255,.20),
            transparent 50%
        );

    transition:
        opacity .5s;

    pointer-events: none;
}

.category:hover {
    transform:
        translateY(-12px);

    border-color:
        rgba(174,133,255,.55);

    box-shadow:
        0 45px 110px
        rgba(0,0,0,.48),

        0 0 55px
        rgba(122,72,255,.16),

        inset 0 1px 0
        rgba(255,255,255,.11);
}

.category:hover::before {
    opacity: 1;
}


/* =========================================================
   CATEGORY IMAGE
========================================================= */

.category-image {
    position: relative;

    height: 245px;

    overflow: hidden;

    background:
        #10101a;
}

.category-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    object-position: center;

    user-select: none;

    -webkit-user-drag: none;

    transition:
        transform .8s
        cubic-bezier(.2,.8,.2,1),

        filter .8s;
}

.category:hover .category-image img {
    transform:
        scale(1.075);

    filter:
        saturate(1.08);
}


/* =========================================================
   IMAGE OVERLAY
========================================================= */

.category-image::before {
    content: "";

    position: absolute;

    inset: 0;

    z-index: 2;

    background:
        linear-gradient(
            to bottom,
            transparent 25%,
            rgba(5,5,11,.10) 50%,
            rgba(5,5,11,.98) 100%
        );
}

.category-image::after {
    content: "";

    position: absolute;

    top: -130%;
    left: -80%;

    width: 45%;
    height: 360%;

    z-index: 4;

    transform:
        rotate(25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transition:
        left .9s ease;
}

.category:hover .category-image::after {
    left: 150%;
}


/* =========================================================
   CATEGORY ICON
========================================================= */

.category-icon {
    position: absolute;

    top: 18px;
    left: 18px;

    z-index: 10;

    width: 43px;
    height: 43px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        rgba(7,7,15,.58);

    border:
        1px solid
        rgba(255,255,255,.15);

    backdrop-filter:
        blur(14px);

    font-size: 18px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.25);
}

.category-number {
    position: absolute;

    right: 20px;
    top: 20px;

    z-index: 10;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 2px;

    color:
        rgba(255,255,255,.45);

    padding:
        7px
        10px;

    border-radius: 9px;

    background:
        rgba(0,0,0,.30);

    backdrop-filter:
        blur(10px);
}


/* =========================================================
   CATEGORY CONTENT
========================================================= */

.category-content {
    position: relative;

    z-index: 10;

    padding:
        21px
        25px
        25px;
}

.category-content h3 {
    font-size: 28px;

    letter-spacing: -.7px;

    margin-bottom: 8px;
}

.category-content p {
    max-width: 90%;

    color:
        rgba(255,255,255,.48);

    font-size: 13px;

    line-height: 1.65;
}

.category-bottom {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 21px;

    font-size: 11px;

    color:
        rgba(255,255,255,.40);

    text-transform: uppercase;

    letter-spacing: 1px;
}

.category-open {
    color:
        #cdbbff;

    font-weight: 800;

    transition:
        transform .35s,
        color .35s;
}

.category:hover .category-open {
    color: #ffffff;

    transform:
        translateX(6px);
}


/* =========================================================
   GALLERY PAGE
========================================================= */

.gallery-page {
    animation:
        galleryEnter .55s
        cubic-bezier(.2,.8,.2,1)
        both;
}

@keyframes galleryEnter {

    from {
        opacity: 0;
        transform:
            translateY(25px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}

.gallery-header {
    margin-bottom: 40px;
}

.back-button {
    display: inline-flex;

    align-items: center;

    gap: 9px;

    padding:
        11px
        17px;

    color:
        rgba(255,255,255,.75);

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.11);

    border-radius: 13px;

    cursor: pointer;

    font-size: 12px;

    transition:
        .3s ease;
}

.back-button:hover {
    color: #ffffff;

    background:
        rgba(255,255,255,.09);

    transform:
        translateX(-5px);

    border-color:
        rgba(174,133,255,.40);
}

.gallery-heading {
    margin-top: 30px;
}

.gallery-heading h2 {
    font-size:
        clamp(42px, 7vw, 78px);

    letter-spacing: -4px;

    background:
        linear-gradient(
            100deg,
            #ffffff,
            #b995ff,
            #67eaff
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.gallery-heading p {
    margin-top: 12px;

    color:
        rgba(255,255,255,.48);

    line-height: 1.7;
}


/* =========================================================
   IMAGE GALLERY
========================================================= */

.gallery-grid {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(0,1fr));

    gap: 20px;
}

.portfolio-image {
    position: relative;

    overflow: hidden;

    border-radius: 21px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.09);

    cursor: pointer;

    transition:
        transform .45s
        cubic-bezier(.2,.8,.2,1),

        border-color .45s,

        box-shadow .45s;
}

.portfolio-image:hover {
    transform:
        translateY(-8px);

    border-color:
        rgba(170,130,255,.50);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.45),

        0 0 35px
        rgba(130,75,255,.12);
}

.portfolio-image img {
    width: 100%;

    height: auto;

    display: block;

    user-select: none;

    -webkit-user-drag: none;

    transition:
        transform .65s
        cubic-bezier(.2,.8,.2,1);
}

.portfolio-image:hover img {
    transform:
        scale(1.045);
}

.image-number {
    position: absolute;

    top: 12px;
    right: 12px;

    padding:
        6px
        9px;

    border-radius: 8px;

    background:
        rgba(0,0,0,.58);

    backdrop-filter:
        blur(12px);

    color:
        rgba(255,255,255,.78);

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1px;
}


/* =========================================================
   LIGHTBOX
========================================================= */

.lightbox {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 30px;

    background:
        rgba(0,0,0,.92);

    backdrop-filter:
        blur(20px);
}

.lightbox.active {
    display: flex;

    animation:
        lightboxIn .25s ease;
}

@keyframes lightboxIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

.lightbox img {
    max-width: 94vw;

    max-height: 88vh;

    object-fit: contain;

    border-radius: 15px;

    box-shadow:
        0 40px 120px
        rgba(0,0,0,.75),

        0 0 70px
        rgba(120,70,255,.15);
}

.close-lightbox {
    position: fixed;

    top: 22px;
    right: 25px;

    width: 46px;
    height: 46px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.08);

    color: #ffffff;

    font-size: 24px;

    cursor: pointer;

    transition:
        .3s ease;
}

.close-lightbox:hover {
    background:
        rgba(255,255,255,.16);

    transform:
        rotate(90deg);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    max-width: 1250px;

    margin: auto;

    padding:
        35px
        7%
        50px;

    text-align: center;

    border-top:
        1px solid
        rgba(255,255,255,.07);

    color:
        rgba(255,255,255,.32);

    font-size: 12px;

    letter-spacing: .5px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .category-grid {
        grid-template-columns: 1fr;
    }

    .gallery-grid {
        grid-template-columns:
            repeat(2, minmax(0,1fr));
    }

}

@media (max-width: 600px) {

    .navbar {
        height: 66px;

        padding:
            0 5%;
    }

    .nav-menu {
        display: none;
    }

    .hero {
        padding:
            90px
            5%
            80px;
    }

    .hero h1 {
        letter-spacing: -4px;
    }

    .main {
        padding:
            0
            5%
            80px;
    }

    .category {
        min-height: 400px;
    }

    .category-image {
        height: 220px;
    }

    .gallery-grid {
        grid-template-columns: 1fr;
    }

    .gallery-heading h2 {
        letter-spacing: -2px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     BACKGROUND LIGHTS
======================================================= -->

<div class="light light-1"></div>
<div class="light light-2"></div>
<div class="light light-3"></div>


<!-- =======================================================
     NAVBAR
======================================================= -->

<nav class="navbar">

    <div class="brand">
        PORTFOLIO
    </div>

    <div class="nav-menu">

        <a href="#home">
            Home
        </a>

        <a href="#portfolio">
            Portfolio
        </a>

    </div>

</nav>


<!-- =======================================================
     HERO
======================================================= -->

<header
    class="hero"
    id="home"
>

    <div class="hero-badge">

        <span></span>

        Creative Portfolio

    </div>


    <h1>
        PORTFOLIO
    </h1>


    <p class="hero-description">

        A curated collection of creative work,
        featuring VTuber models, logo designs,
        banners and custom emotes.

    </p>

</header>


<!-- =======================================================
     MAIN PORTFOLIO
======================================================= -->

<main
    class="main"
    id="main"
>

    <section
        id="portfolio"
    >

        <div class="section-top">

            <div class="eyebrow">
                Selected Work
            </div>

            <h2>
                Explore My Work
            </h2>

            <p>
                Select a category to explore the full collection.
            </p>

        </div>


        <div
            class="category-grid"
            id="categoryGrid"
        ></div>

    </section>

</main>


<!-- =======================================================
     FOOTER
======================================================= -->

<footer class="footer">

    © 2026 PORTFOLIO — All Rights Reserved

</footer>


<!-- =======================================================
     LIGHTBOX
======================================================= -->

<div
    class="lightbox"
    id="lightbox"
>

    <button
        class="close-lightbox"
        id="closeLightbox"
        type="button"
        aria-label="Close"
    >
        ×
    </button>


    <img
        id="lightboxImage"
        src=""
        alt="Portfolio preview"
        draggable="false"
    >

</div>


<script>

/* =========================================================
   PORTFOLIO DATA
   EXACT FILENAMES PROVIDED BY YOU
========================================================= */

const portfolio = {

    vtuber: {

        title: "VTuber Model",

        icon: "✦",

        description:
            "PNG VTuber model and character design collection.",

        images: [

            "Png%20model%201.jpeg",

            "Png%20model%202.jpeg",

            "Png%20model%203.jpeg",

            "Png%20model%204.jpeg",

            "Png%20model%205.jpeg",

            "Png%20model%206.jpeg",

            "Png%20model%207.jpeg",

            "Png%20model%208.jpeg"

        ]

    },


    logo: {

        title: "Logo",

        icon: "◇",

        description:
            "Custom logo and visual identity design collection.",

        images: [

            "logo%201.jpeg",

            "logo4.jpeg",

            "logo5.jpeg",

            "Logo2.jpeg",

            "Logo3.jpeg"

        ]

    },


    banner: {

        title: "Banner",

        icon: "▱",

        description:
            "Professional banners for streamers, VTubers and social media.",

        images: [

            "Banner1.jpeg",

            "Banner3.jpeg",

            "Banner7.jpeg",

            "Banner6.jpeg",

            "banner5.jpeg",

            "banner4.jpeg",

            "banner2.jpeg"

        ]

    },


    emotes: {

        title: "Emotes",

        icon: "♡",

        description:
            "Custom stream emotes and expressive VTuber artwork.",

        images: [

            "Emotes%201.jpeg",

            "Emotes%202.jpeg",

            "Emotes%203.jpeg",

            "Emotes%204.jpeg"

        ]

    }

};


/* =========================================================
   ELEMENTS
========================================================= */

const categoryGrid =
    document.getElementById("categoryGrid");

const main =
    document.getElementById("main");

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const closeLightbox =
    document.getElementById("closeLightbox");


/* =========================================================
   CREATE CATEGORY CARDS
========================================================= */

function createCategories() {

    categoryGrid.innerHTML = "";

    Object.entries(portfolio).forEach(
        ([key, category], index) => {

            const card =
                document.createElement("article");

            card.className =
                "category";


            card.innerHTML = `

                <div class="category-image">

                    <img
                        src="${category.images[0]}"
                        alt="${category.title}"
                        loading="lazy"
                        draggable="false"
                    >

                    <div class="category-icon">
                        ${category.icon}
                    </div>

                    <div class="category-number">
                        ${String(index + 1).padStart(2, "0")}
                    </div>

                </div>


                <div class="category-content">

                    <h3>
                        ${category.title}
                    </h3>

                    <p>
                        ${category.description}
                    </p>

                    <div class="category-bottom">

                        <span>
                            ${category.images.length}
                            ${category.images.length === 1
                                ? "Project"
                                : "Projects"}
                        </span>

                        <span class="category-open">
                            Explore →
                        </span>

                    </div>

                </div>

            `;


            card.addEventListener(
                "click",
                () => openCategory(key)
            );


            categoryGrid.appendChild(card);

        }
    );

}


/* =========================================================
   OPEN CATEGORY
========================================================= */

function openCategory(key) {

    const category =
        portfolio[key];

    if (!category) {
        return;
    }


    main.innerHTML = `

        <section class="gallery-page">

            <div class="gallery-header">

                <button
                    class="back-button"
                    id="backButton"
                    type="button"
                >
                    ← Back to Portfolio
                </button>


                <div class="gallery-heading">

                    <div class="eyebrow">
                        Portfolio / ${category.title}
                    </div>

                    <h2>
                        ${category.title}
                    </h2>

                    <p>
                        ${category.description}
                    </p>

                </div>

            </div>


            <div class="gallery-grid">

                ${category.images.map(
                    (image, index) => `

                        <div
                            class="portfolio-image"
                            data-image="${image}"
                        >

                            <img
                                src="${image}"
                                alt="${category.title} ${index + 1}"
                                loading="lazy"
                                draggable="false"
                            >

                            <div class="image-number">
                                ${String(index + 1).padStart(2, "0")}
                            </div>

                        </div>

                    `
                ).join("")}

            </div>

        </section>

    `;


    /* Back button */

    document
        .getElementById("backButton")
        .addEventListener(
            "click",
            showPortfolio
        );


    /* Gallery images */

    document
        .querySelectorAll(".portfolio-image")
        .forEach(imageCard => {

            imageCard.addEventListener(
                "click",
                () => {

                    const image =
                        imageCard.dataset.image;

                    openLightbox(image);

                }
            );

        });


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   SHOW PORTFOLIO
========================================================= */

function showPortfolio() {

    location.reload();

}


/* =========================================================
   LIGHTBOX
========================================================= */

function openLightbox(image) {

    lightboxImage.src =
        image;

    lightbox.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";

}


function closePreview() {

    lightbox.classList.remove(
        "active"
    );

    lightboxImage.src = "";

    document.body.style.overflow =
        "";

}


closeLightbox.addEventListener(
    "click",
    closePreview
);


lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {
            closePreview();
        }

    }
);


/* =========================================================
   ESC TO CLOSE LIGHTBOX
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {
            closePreview();
        }

    }
);


/* =========================================================
   IMAGE PROTECTION
========================================================= */

document.addEventListener(
    "contextmenu",
    event => {

        if (
            event.target.tagName === "IMG"
        ) {
            event.preventDefault();
        }

    }
);


document.addEventListener(
    "dragstart",
    event => {

        if (
            event.target.tagName === "IMG"
        ) {
            event.preventDefault();
        }

    }
);


/* =========================================================
   START WEBSITE
========================================================= */

createCategories();

</script>

</body>
</html>
